      </div>
      <div class="empan-stage"><div class="empan-phrase blank" id="emPhrase"></div></div>
      <div class="empan-score" id="emScore" style="margin-top:12px">empan ${span} mots · ${correct} justes</div>
    </div>`;
    const ph=$('#emPhrase');
    await sleep(500,tok);
    if(!alive(tok)) return null;
    const phraseText=item.w.slice(0,nWords).join(' ');
    const shownVariants=empanVariants({w:item.w.slice(0,nWords),s:item.s.filter(x=>x.i<nWords)});
    ph.textContent=phraseText; ph.classList.remove('blank'); fitText(ph);
    await sleep(DUR,tok); if(!alive(tok)) return null;
    ph.classList.add('blank'); ph.textContent=phraseText;
    setHost();
    host.innerHTML=`<div class="block" style="max-width:680px">
      <div class="block-head" style="text-align:left">
        <span class="eyebrow">Empan visuel · essai ${t+1}/${items.length}</span>
        <h2 style="font-size:19px">Laquelle as-tu vue ?</h2>
      </div>
      <div class="empan-opts">
        ${shownVariants.map((v,k)=>`<button class="opt" data-p="${esc(v.phrase)}"><span class="ok-k mono">${k+1}</span><span>${esc(v.phrase)}</span></button>`).join('')}
      </div>
      <div class="empan-score" id="emScore2" style="margin-top:14px">empan ${span} mots · ${correct} justes</div>
    </div>`;
    const picked=await new Promise(r=>{
      const onClick=e=>{ const b=e.target.closest('[data-p]'); if(!b) return; r(b.dataset.p); };
      const onKey=e=>{ const k=+e.key; if(k>=1&&k<=shownVariants.length){ const b=host.querySelectorAll('.opt')[k-1]; if(b) b.click(); } };
      host.addEventListener('click',onClick); document.addEventListener('keydown',onKey);
      cleanups.push(()=>{ host.removeEventListener('click',onClick); document.removeEventListener('keydown',onKey); });
    });
    if(!alive(tok)) return null;
    const good=picked===phraseText;
    // escalier 2/3 : on ne monte qu'après deux réussites au même empan
    if(good){ correct++; hits++; miss=0; } else { hits=0; miss++; }
    if(hits>=2){ span=clamp(span+1,3,9); hits=0; }
    else if(miss>=2){ span=clamp(span-1,3,9); miss=0; }
    $$('.opt',host).forEach(b=>{ if(b.dataset.p===phraseText) b.classList.add('good'); else if(b.dataset.p===picked) b.classList.add('bad'); else b.classList.add('dim'); });
    const sc=$('#emScore2'); if(sc) sc.textContent=`${good?'juste':'raté'} · empan ${span} mots · ${correct} justes`;
    await sleep(700,tok);
    if(!alive(tok)) return null;
  }
  S.span=span; save();
  return {correct,total:items.length,span,bestSpan:bestSpan||span,comp:correct/items.length};
}

/* Empan vertical : une colonne de mots, deux flèches au centre pour la fixation.
   On ne lit pas la colonne mot à mot : on fixe le milieu et on prend les extrêmes
   en vision périphérique verticale. */
const EV_WORDS=['colline','boussole','horloge','rivière','charbon','roquette','paradoxe','jaquette','fourneau','brouette','lumière','chapitre','galerie','mercredi','poussière','triangle','héritage','pellicule','caravane','défilé','marteau','brouillard','cuillère','épouvante','fromage','clocher','barrage','tulipe','manège','sifflet'];

    stage.classList.add('show');
    await sleep(DUR,tok); if(!alive(tok)) return null;
    stage.classList.remove('show');
    const col2=$('#evCol'); if(col2) col2.innerHTML=col.map(()=>'<span class="ev-w">•••</span>').join('');
    setHost();
    host.innerHTML=`<div class="block" style="max-width:620px">
      <div class="block-head" style="text-align:left">
        <span class="eyebrow">Empan vertical · essai ${t+1}/${n}</span>

      <div class="empan-opts">

      </div>
      <div class="empan-score" id="evScore2" style="margin-top:14px">empan ${span} mots · ${correct} justes</div>
    </div>`;
    const picked=await new Promise(r=>{
      const onClick=e=>{ const b=e.target.closest('[data-p]'); if(!b) return; r(b.dataset.p); };
      const onKey=e=>{ const k=+e.key; if(k>=1&&k<=opts.length){ const b=host.querySelectorAll('.opt')[k-1]; if(b) b.click(); } };

    });
    if(picked==='__abort'||!alive(tok)) return null;
    const good=picked===target;
    if(good){ correct++; hits++; miss=0; } else { hits=0; miss++; }
    if(hits>=2){ span=clamp(span+1,3,7); hits=0; }
    else if(miss>=2){ span=clamp(span-1,3,7); miss=0; }

    const sc=$('#evScore2'); if(sc) sc.textContent=`${good?'juste':'raté'} · empan ${span} mots · ${correct} justes`;

/* Éventail visuel : un nombre de plus en plus long, flashé de plus en plus court.
   On ne relit pas, on ne compte pas : on prend le nombre entier d'un seul regard,
   puis on le restitue. C'est l'exercice du livre, transposé au clavier. */
const FAN_MAXLEN=8;
function fanNumber(len){
  let s=String(1+Math.floor(Math.random()*9));
  while(s.length<len) s+=String(Math.floor(Math.random()*10));
  return s;
}
// exposition par longueur : plus le nombre est long, moins on a de temps
function fanDur(len){ return clamp(420-(len-2)*40,180,460); }
async function blockEventail(tok,trials=12,startLen){
  let len=clamp(startLen||S.fanLen||2,2,FAN_MAXLEN);
  const n=Math.max(4,trials|0);
  let correct=0, hits=0, miss=0, bestLen=len;
  for(let t=0;t<n;t++){
    if(!alive(tok)) return null;
    const dur=fanDur(len), num=fanNumber(len);
    setHost();
    host.innerHTML=`<div class="block" style="max-width:660px">
      <div class="block-head" style="text-align:center">
        <span class="eyebrow">Éventail visuel · essai ${t+1}/${n}</span>
        <h2 style="font-size:19px">${len} chiffres, ${dur} ms</h2>
        <p style="margin:0">Fixe le centre, ne lis pas chiffre par chiffre : prends le nombre d'un seul regard.</p>
      </div>
      <div class="fan-stage"><b class="fan-num blank" id="fanNum"></b></div>
      <div class="empan-score" id="fanScore" style="margin-top:12px">longueur ${len} chiffres · ${correct} justes</div>
    </div>`;
    const el=$('#fanNum');
    await sleep(480,tok); if(!alive(tok)) return null;
    el.textContent=num; el.classList.remove('blank'); fitText(el);
    await sleep(dur,tok); if(!alive(tok)) return null;
    el.classList.add('blank');

    // restitution : la validation part dès que le nombre de chiffres est atteint
    setHost();
    host.innerHTML=`<div class="block" style="max-width:660px">
      <div class="block-head" style="text-align:center">
        <span class="eyebrow">Éventail visuel · essai ${t+1}/${n}</span>
        <h2 style="font-size:19px">Quel nombre as-tu vu ?</h2>
        <p style="margin:0">Tape les ${len} chiffres : la réponse est validée dès le dernier.</p>
      </div>
      <div class="fan-input-wrap"><input id="fanInput" class="fan-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="${len}" aria-label="Nombre vu"></div>
      <div class="fan-reveal" id="fanReveal"></div>
      <div class="empan-score" id="fanScore2" style="margin-top:14px">longueur ${len} chiffres · exposé ${dur} ms · ${correct} justes</div>
    </div>`;
    const inp=$('#fanInput'), rev=$('#fanReveal'), sc2=$('#fanScore2');
    const typed=await new Promise(resolve=>{
      let done=false;
      const finish=v=>{ if(done) return; done=true; document.removeEventListener('keydown',onKey); resolve(v); };
      const read=()=>{ const raw=(inp.value||'').replace(/\D/g,'').slice(0,len); if(inp.value!==raw) inp.value=raw; return raw; };
      const onInput=()=>{ const v=read(); if(v.length>=len) finish(v); };
      const onKey=e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=read(); if(v) finish(v); } };
      inp.addEventListener('input',onInput); document.addEventListener('keydown',onKey);
      cleanups.push(()=>{ inp.removeEventListener('input',onInput); document.removeEventListener('keydown',onKey); });
      try{ inp.focus(); }catch(e){}
      // une saisie déjà complète (autofill, collage) part tout de suite
      const pre=read(); if(pre.length>=len) finish(pre);
    });
    if(!alive(tok)) return null;
    const good=typed===num;
    if(good){ correct++; hits++; miss=0; } else { hits=0; miss++; }
    // escalier 3 sur ... : trois réussites de suite pour allonger, deux échecs pour raccourcir
    if(hits>=3){ len=clamp(len+1,2,FAN_MAXLEN); hits=0; bestLen=Math.max(bestLen,len); }
    else if(miss>=2){ len=clamp(len-1,2,FAN_MAXLEN); miss=0; }
    if(good) bestLen=Math.max(bestLen,typed.length);
    if(rev){
      rev.innerHTML=[...num].map((c,i)=>`<i class="${typed[i]===c?'ok':'no'}">${c}</i>`).join('');
      if(!good){
        const toi=document.createElement('div');
        toi.className='empan-score';
        toi.style.marginTop='8px';
        toi.textContent='toi : '+(typed||'—');
        rev.parentElement.insertBefore(toi,rev.nextSibling);
      }
    }
    if(sc2) sc2.textContent=`${good?'juste':'raté'} · longueur ${len} chiffres · ${correct} justes`;
    await sleep(good?750:1200,tok);
    if(!alive(tok)) return null;
  }
  S.fanLen=len; save();
  return {correct,total:n,span:len,bestSpan:Math.max(bestLen,len),comp:correct/n};
}

const STOP=new Set("le la les de des du un une et a à en dans pour par sur avec sans que qui quoi dont où est sont être avoir ont au aux ce cet cette ces il elle ils elles on nous vous je tu se sa son ses leur leurs plus moins très comme mais ou donc or ni car si ne pas y d l qu c j n s".split(/\s+/));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim();
function keyIdeas(text){
  const counts=new Map();
  norm(text).split(' ').filter(w=>w.length>=5&&!STOP.has(w)).forEach(w=>counts.set(w,(counts.get(w)||0)+1));
  return Array.from(counts.entries()).sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length).slice(0,20).map(x=>x[0]);
}
function coverage(text,recall){
  const ideas=keyIdeas(text), rs=new Set(norm(recall).split(' '));
  let hit=0; const missed=[];
  ideas.forEach(k=>{
    const found=Array.from(rs).some(w=>w===k||(w.length>=6&&k.length>=6&&(w.startsWith(k.slice(0,6))||k.startsWith(w.slice(0,6)))));
    if(found) hit++; else missed.push(k);
  });
  return {score:ideas.length?hit/ideas.length:0, ideas, missed, matched:hit};
}

}

const READ_MODES=new Set(['rsvp','pacer','metronome','guide']);

async function runReadingBlock(spec,tok,text,niveau){
  const wpm=clamp(spec.wpm||S.wpm,120,WPM_MAX);
  // taille du groupe : la préférence de l'utilisateur est un plancher, le niveau impose le reste
  const chunk=spec.chunk||clamp(Math.max(S.chunk||1, chunkForLevel()),1,8);
  const t=text||pickText(niveau||niveauCourant(),{maxWords:800});

  if(spec.k==='rsvp') read=await blockRsvp(tok,t,wpm,chunk);
  else if(spec.k==='pacer') read=await blockPacer(tok,t,wpm);
  else if(spec.k==='metronome') read=await blockMetronome(tok,t,wpm,spec.wpBeat||chunk);

async function runSpec(spec,tok,ctx){
  switch(spec.k){
    case 'schulte': return await blockGrid(tok,{size:spec.size||4,mode:'num'});
    case 'lettres': return await blockGrid(tok,{size:spec.size||4,mode:spec.mode||'alpha'});
    case 'empan': return await blockEmpan(tok,spec.n||8,spec.span);
    case 'empanV': return await blockEmpanV(tok,spec.n||8,spec.span);
    case 'eventail': return await blockEventail(tok,spec.n||12,spec.len);
    case 'saccades': return await blockSaccades(tok,spec.rounds||3);
    case 'peripherie': { if(spec.dur){ S.periphDur=clamp(spec.dur,80,320); save(); } return await blockPeriph(tok,spec.rounds||8); }
    case 'ortho': return await blockOrtho(tok,spec.n||20);
    case 'suppression': { const lvl=(ctx&&ctx.niveau)||niveauCourant();
      const t1=pickText(lvl,{maxWords:800}); let t2=pickText(lvl,{maxWords:800});
      if(t2.id===t1.id) t2=pickText(lvl,{maxWords:800});
      const w=spec.wpm||Math.max(250,S.wpm);
      // ordre contrebalancé : une session sur deux commence par la boucle (biais d'ordre, de fatigue et de familiarité)
      S.voixN=(S.voixN||0)+1; save();
      const loopFirst=(S.voixN%2===0);
      const one=async(t,loop)=>{
        const rd=await blockSuppression(tok,t,w,1,loop);
        if(!rd||!alive(tok)) return null;
        return await askQuiz(tok,sampleQuiz(t,quizSize(t)),t.titre);
      };
      let qLoop,qCtrl;
      if(loopFirst){
        qLoop=await one(t2,true); if(!qLoop||!alive(tok)) return null;
        qCtrl=await one(t1,false); if(!qCtrl||!alive(tok)) return null;
      } else {
        qCtrl=await one(t1,false); if(!qCtrl||!alive(tok)) return null;
        qLoop=await one(t2,true); if(!qLoop||!alive(tok)) return null;
      }
      const qa=await askComfort(tok);
      return {k:'suppression',wpm:w,text:t2.titre,textCtrl:t1.titre,words:0,seconds:0,
        comp:qLoop.comp,compCtrl:qCtrl.comp,compLoop:qLoop.comp,gap:Math.round((qCtrl.comp-qLoop.comp)*100),
        ctrlCorrect:qCtrl.correct,ctrlTotal:qCtrl.total,correct:qLoop.correct,total:qLoop.total,
        loopFirst,comfort:qa?qa.comfort:null}; }
    case 'rsvp': case 'pacer': case 'metronome': case 'guide':
      return await runReadingBlock(spec,tok,ctx&&ctx.text,ctx&&ctx.niveau);
    case 'rappel': { const t=(ctx&&ctx.text)||pickText((ctx&&ctx.niveau)||niveauCourant());
      const r=await blockRecall(tok,t); return r?Object.assign({k:'rappel',text:t.titre,wpm:S.wpm,comp:null},r):null; }
    case 'examen': { const t=(ctx&&ctx.text)||pickText((ctx&&ctx.niveau)||niveauCourant());
      const rd=await blockFreeRead(tok,t);
      if(!rd||!alive(tok)) return null;
      const q=await askQuiz(tok,t.q,t.titre);          // toutes les questions du texte
      if(!q||!alive(tok)) return null;
      const words=rd.words||wc(t.corps);
      const wpmReal=rd.seconds>3?Math.round(words/rd.seconds*60):null;
      return {k:'examen',text:t.titre,words,seconds:rd.seconds,wpm:wpmReal,comp:q.comp,correct:q.correct,total:q.total}; }
    default: return null;
  }
}

/* -------- étape du parcours -------- */
async function launchEtape(idx){
  const e=ETAPES[idx];
  lastRun=null;   // une étape n'est pas un exercice libre : pas de « Recommencer » avec réglages
  const tok=begin('Étape '+(idx+1)+' / '+ETAPES.length+' — '+e.nom, specMetaOfEtape(e));
  if(!tok) return;
  S.combo=0;
  const niveau=e.niveau||1;
  // plancher de vitesse : une seule fois par étape, pour ne pas effacer une baisse méritée
  if(S.wpm<e.cible && S.etapeFloor!==e.id){ S.wpm=e.cible; S.etapeFloor=e.id; save(); }
  const text=pickText(niveau,{maxWords:800});
  const res={etape:e.id,mode:'etape',ts:Date.now(),blocks:[],comp:null,wpm:S.wpm,span:S.span,schulte:null,lettres:null,
    saccades:null,saccadesTotal:null,empanCorrect:null,empanTotal:null,empanBestSpan:null,recall:null,words:0,seconds:0};
  const ok=await blockCountdown(tok,e.nom); if(!ok||!alive(tok)) return endStage();
  for(const spec of e.blocks){
    if(!alive(tok)) return;
    await maybeEyeBreak(tok);
    const r=await runSpec(spec,tok,{text,niveau});
    if(!alive(tok)) return;
    if(!r) continue;
    res.blocks.push({k:spec.k,label:specLabel(spec),...r});
    if((spec.k==='schulte'||spec.k==='lettres')&&r.completed){
      res[spec.k]=r.seconds;
      const key=r.size+(spec.k==='lettres'?'L':'N');
      if(!S.schulteBest[key]||r.seconds<S.schulteBest[key]) S.schulteBest[key]=r.seconds;
    }
    if(spec.k==='saccades'){ res.saccades=r.correct; res.saccadesTotal=r.total; }
    if(spec.k==='ortho'){ res.orthoScore=r.correct; res.orthoTotal=r.total; res.orthoMedian=r.median; }
    if(spec.k==='suppression'){ res.suppComp=r.compLoop; res.suppCtrl=r.compCtrl; res.voixGap=r.gap; res.wpm=r.wpm; res.comp=r.compLoop; }
    if(spec.k==='empan'){ res.empanCorrect=r.correct; res.empanTotal=r.total; res.empanBestSpan=r.bestSpan; res.span=r.span; }
    if(READ_MODES.has(spec.k)&&r.comp!=null) res.comp=r.comp;
    if(spec.k==='rappel'){ res.recall=r.recall; res.words=r.words||0; res.seconds=r.seconds||0; res.recallWords=r.recallWords; res.ideas=r.matched+'/'+r.ideas;
      res.realWpm=r.seconds?Math.round(r.words/r.seconds*60):null; }
    if(READ_MODES.has(spec.k)){ res.words=r.words; res.seconds=r.seconds; }
  }
  if(!res.blocks.length){ toast('Séance interrompue'); return endStage(); }
  // journalisation
  const logs=S.logs[e.id]||(S.logs[e.id]=[]);
  logs.push(res);
  S.history.push({ts:res.ts,mode:'etape '+e.id,label:'Étape '+e.id+' — '+e.nom,wpm:res.wpm,comp:res.comp,effective:res.comp!=null?res.wpm*res.comp:null,words:res.words,seconds:res.seconds});
  adaptAfter(res);
  if(res.suppComp!=null) recordVoix(res.suppComp,res.suppCtrl,res.wpm);
  res.xp=addXp(xpFor(res));
  if(etapeValidated(e)) S.etapeFloor=null;   // étape suivante : le plancher se réapplique à sa cible
  save();
  await showEtapeResult(res,e,tok,idx);
}

function adaptAfter(res){
  if(res.comp==null) return;
  if(res.suppComp!=null) return;   // diagnostic sous boucle : ne déplace pas la vitesse
  const before=S.wpm;
  const c=res.comp;
  if(c>=.75){
    const rapide=(res.blocks||[]).some(b=>b.comfort==='rapide');
    if(!rapide) S.wpm=clamp(S.wpm+20,120,WPM_MAX);
  } else if(c>=.5){ /* consolider */ }
  else { S.wpm=clamp(S.wpm-20,120,WPM_MAX); }
  res.delta=S.wpm-before;
}

async function showEtapeResult(res,e,tok,idx){
  const crit=e.crit(etapeLogs(e.id));
  const passed=crit.items.every(i=>i.ok);
  const nxt=ETAPES[idx+1]||null;
  const allDone=parcoursDone();
  const pendIdx=currentEtapeIdx(), pend=ETAPES[pendIdx];
  setHost();
  const rows=res.blocks.map(b=>{
    let v='—';
    if(b.k==='schulte'||b.k==='lettres') v=b.completed?b.seconds.toFixed(1)+' s':'passé';
    if(b.k==='empan') v=b.correct+'/'+b.total+' justes · empan '+b.span+' mots';
    if(b.k==='saccades') v=b.correct+'/'+b.total+' séquences';
    if(READ_MODES.has(b.k)) v=b.correct+'/'+b.total+' justes · '+Math.round(b.wpm)+' mpm';
    if(b.k==='rappel') v=Math.round(b.recall*100)+' % des idées · '+b.recallWords+' mots écrits';
    return `<div class="block-row"><span class="bi">·</span><span>${esc(b.label||specLabel(b))}</span><span class="bt">${v}</span></div>`;
  }).join('');
  const headline = passed ? 'Étape validée.' : (res.comp!=null&&res.comp<.5 ? "Trop d'informations perdues." : 'Critère non atteint — on reprend.');
  host.innerHTML=`<div class="result">
    <span class="eyebrow">Étape ${idx+1} sur ${ETAPES.length} · ${esc(e.nom)}</span>
    <h2>${headline}</h2>
    ${res.comp!=null?`<div class="result-grid">
      <div><span class="eyebrow">Vitesse</span><b>${Math.round(res.wpm)}</b><small>mots/min</small></div>
      <div><span class="eyebrow">Compréhension</span><b>${Math.round(res.comp*100)}</b><small>% · ${res.blocks.filter(b=>b.total).map(b=>b.correct+'/'+b.total).join(' · ')||'—'}</small></div>
      <div class="hi"><span class="eyebrow">Lecture utile</span><b>${Math.round(res.wpm*res.comp)}</b><small>indice débit × QCM</small></div>
    </div>`:''}
    ${res.recall!=null?`<div class="result-grid">
      <div><span class="eyebrow">Couverture</span><b>${Math.round(res.recall*100)}</b><small>% des idées clés</small></div>
      <div><span class="eyebrow">Vitesse réelle</span><b>${res.realWpm||'—'}</b><small>mots/min, sans consigne</small></div>
      <div><span class="eyebrow">Écrit</span><b>${res.recallWords||0}</b><small>mots de rappel</small></div>
    </div>`:''}
    <div class="xp"><span class="xp-num">Nv ${niveauInfo().n}</span><span class="xp-bar"><i style="width:${niveauInfo().pct}%"></i></span><span class="xp-num">+${res.xp?res.xp.pts:0} XP · ${niveauInfo().rest}/${niveauInfo().need}</span></div>
    <div style="border-top:1px solid var(--line);margin-bottom:16px">${rows}</div>
    <div class="crit">
      <span class="eyebrow" style="margin-bottom:6px">Critère de passage</span>
      <ul>${crit.items.map(i=>`<li class="${i.ok?'ok':''}"><span class="mk">${i.ok?'✓':'·'}</span><span>${esc(i.label)}</span><span class="val">${esc(i.val||'')}</span></li>`).join('')}</ul>
    </div>
    <div class="verdict">${verdictText(res,crit,passed,nxt)}</div>
    <div class="result-actions">
      ${passed&&nxt?`<button class="btn primary" id="goNext">Étape suivante : ${esc(nxt.nom)} →</button>`:''}
      ${passed&&!nxt&&allDone?`<button class="btn primary" id="goParcours">Parcours terminé — voir le bilan</button>`:''}
      ${passed&&!nxt&&!allDone?`<button class="btn primary" id="goPending">Reprendre l'étape ${pendIdx+1} : ${esc(pend.nom)} →</button>`:''}
      <button class="btn" id="again">Refaire l'étape</button>
      <button class="btn ghost" id="back">Quitter</button>
    </div>
  </div>`;
  const wire=(id,fn)=>{ const b=$('#'+id); if(b) b.addEventListener('click',()=>{ endStage(); fn(); }); };
  wire('goNext',()=>launchEtape(idx+1));
  wire('goPending',()=>launchEtape(pendIdx));
  wire('again',()=>launchEtape(idx));
  wire('goParcours',()=>setView('progress'));
  wire('back',()=>setView('dash'));
}

function verdictText(res,crit,passed,nxt){
  const d=res.delta||0;
  let s='';
  const failed=crit.items.filter(i=>!i.ok);
  const counting=failed.filter(i=>/^\d+\/\d+$/.test((i.val||'').trim()));
  const needsMore=!passed && counting.length>0 && counting.length===failed.length;
  if(res.comp==null&&res.recall==null){
    s = passed
      ? `<strong>Mesures visuelles au niveau demandé.</strong> Ici la vitesse n'est pas jugée : ce sont la largeur du champ visuel et la constance qui comptent. La suite ajoute le rythme.`
      : "Séance visuelle enregistrée. Ce type d'exercice ne se juge pas sur la vitesse mais sur la régularité : refais-le à froid pour comparer.";
  } else if(res.comp==null&&res.recall!=null){
    s=`<strong>Couverture : ${Math.round(res.recall*100)} % des idées clés.</strong> `+
      (passed?'Le rappel est suffisant : la vitesse ne sert à rien si rien ne reste.':"Ce n'est pas la vitesse qui manque ici, c'est la trace laissée. Refais l'étape en ralentissant légèrement.")+
      (nxt?'':' Tu as fait le tour du parcours.');
  } else if(passed){
    s=`<strong>Critère atteint.</strong> Lecture utile : ${Math.round(res.wpm*res.comp)} (débit × compréhension, un indice, pas une mesure du regard). `+
      (d>0?`Le rythme monte de ${d} mots/min pour la suite.`:'Le rythme reste identique pour consolider.')+
      (nxt?` Prochaine étape : ${esc(nxt.nom)}.`:' Tu as fait le tour du parcours — reste en entretien.');
  } else if(needsMore){
    const gap=counting.map(i=>i.val).join(' ');
    s=`<strong>Ce passage est bon, il en manque un.</strong> Ce critère demande de répéter l'exercice pour vérifier que le résultat n'est pas un coup de chance (${esc(gap)}). `+
      `Refais l'étape maintenant, à froid : la deuxième mesure vaut plus que la première.`;
  } else {
    const miss=failed.map(i=>i.label.toLowerCase()).join(' ; ');
    s=`<strong>Il reste :</strong> ${esc(miss)}. `+
      (d<0?`La vitesse redescend de ${Math.abs(d)} mots/min : mieux vaut comprendre à 240 que survoler à 320.`:
       d>0?`Le rythme monte de ${d} mots/min sur les points déjà acquis.`:
       `Garde le même rythme et refais l'étape : la régularité compte plus que le record.`);
  }
  return s;
}

/* -------- mesure de départ -------- */
async function launchCalibrage(){
  const tok=begin('Mesure de départ','lecture libre · 4 questions');
  if(!tok) return;
  const text=pickText(2);
  const r=await blockFreeRead(tok,text);
  if(!r||!alive(tok)) return endStage();
  const quiz=await askQuiz(tok,sampleQuiz(text,4),text.titre);
  if(!quiz||!alive(tok)) return endStage();
  const wpm=r.seconds>3?Math.round(wc(text.corps)/r.seconds*60):0;
  const target=clamp(Math.round((wpm*(quiz.comp>=.75?1.12:1))/10)*10,120,WPM_MAX);
  S.wpm=target; S.onboarded=true; bumpStreak();
  S.history.push({ts:Date.now(),mode:'calibrage',label:'Mesure de départ',wpm,comp:quiz.comp,effective:wpm*quiz.comp,words:wc(text.corps),seconds:r.seconds});
  save();
  setHost();
  host.innerHTML=`<div class="result">
    <span class="eyebrow">Mesure de départ · ${esc(text.titre)}</span>
    <h2>Ta vitesse naturelle : ${wpm} mots/min</h2>
    <div class="result-grid">
      <div><span class="eyebrow">Vitesse mesurée</span><b>${wpm}</b><small>mots/min, lecture normale</small></div>
      <div><span class="eyebrow">Compréhension</span><b>${Math.round(quiz.comp*100)}</b><small>% · ${quiz.correct}/${quiz.total}</small></div>
      <div class="hi"><span class="eyebrow">Vitesse cible</span><b>${target}</b><small>mots/min pour démarrer</small></div>
    </div>
    <div class="verdict">${quiz.comp>=.75
      ? `Tu lis vite et tu comprends : la cible démarre <strong>12 % au-dessus</strong> de ta vitesse mesurée, et le parcours la fera monter par paliers tant que la compréhension tient.`
      : `Compréhension fragile à cette allure : la cible reste à ta vitesse mesurée. Le parcours commencera par consolider la saisie avant d'accélérer — c'est l'ordre correct.`}
      <br><br>La vitesse cible <strong>n'est pas un objectif fixe</strong> : elle bouge de ±20 mots/min après chaque séance, selon ce que tu comprends réellement.</div>
    <div class="result-actions">
      <button class="btn primary" id="calGo">Commencer l'étape 1</button>
      <button class="btn ghost" id="calLater">Plus tard</button>
    </div>
  </div>`;
  const go=async(id,fn)=>{ const b=$('#'+id); if(b) b.addEventListener('click',()=>{ endStage(); fn(); }); };
  go('calGo',()=>launchEtape(0));
  go('calLater',()=>setView('dash'));
}

/* -------- réglages par exercice (feuille avant lancement) -------- */
const EXO_CFG={
  schulte:[{key:'size',label:'Grille',vals:[4,5],fmt:v=>v+'×'+v}],
  lettres:[{key:'size',label:'Grille',vals:[4,5],fmt:v=>v+'×'+v}],
  empan:[{key:'n',label:'Essais',vals:[6,8,12]},{key:'span',label:'Mots au départ',vals:[3,4,5,6,7]}],
  empanV:[{key:'n',label:'Essais',vals:[6,8,12]},{key:'span',label:'Mots au départ',vals:[3,4,5,6,7]}],
  eventail:[{key:'n',label:'Essais',vals:[6,12,18]},{key:'len',label:'Chiffres au départ',vals:[2,3,4,5,6,7,8]}],
  saccades:[{key:'rounds',label:'Séquences',vals:[2,3,5]}],
  peripherie:[{key:'rounds',label:'Essais',vals:[6,8,12]},{key:'dur',label:'Exposition',vals:[120,160,220,280],fmt:v=>v+' ms'}],
  rsvp:[{key:'wpm',type:'range',label:'Vitesse',unit:'mots/min'},{key:'chunk',label:'Mots par affichage',vals:[1,2,3,4,5,6,7,8]}],
  metronome:[{key:'wpm',type:'range',label:'Vitesse',unit:'mots/min'},{key:'chunk',label:'Mots par affichage',vals:[1,2,3,4,5,6,7,8]}],
  pacer:[{key:'wpm',type:'range',label:'Vitesse',unit:'mots/min'}],
  guide:[{key:'wpm',type:'range',label:'Vitesse',unit:'mots/min'},{key:'group',label:'Mots par point',vals:[2,3,4]}],
  suppression:[{key:'wpm',type:'range',label:'Vitesse',unit:'mots/min'},{key:'chunk',label:'Mots par affichage',vals:[1,2]}],
  ortho:[{key:'n',label:'Mots',vals:[10,20,30]}]
};
function exoDefaults(kind){
  const size=levelIdx()>=3?5:4;
  const d={
    schulte:{size}, lettres:{size},
    empan:{n:8,span:clamp(S.span||4,3,9)},
    empanV:{n:8,span:clamp(S.spanV||4,3,7)},
    eventail:{n:12,len:clamp(S.fanLen||2,2,8)},
    saccades:{rounds:3},
    peripherie:{rounds:8,dur:clamp(S.periphDur||220,80,320)},
    rsvp:{wpm:S.wpm,chunk:clamp(S.chunk||1,1,8)},
    metronome:{wpm:S.wpm,chunk:clamp(S.chunk||1,1,8)},
    pacer:{wpm:S.wpm},
    guide:{wpm:S.wpm,group:3},
    suppression:{wpm:Math.max(250,S.wpm),chunk:1},
    ortho:{n:20}
  };
  return Object.assign({},d[kind]||{});
}
function specFromPrefs(kind,p){
  switch(kind){
    case 'schulte': return {k:'schulte',size:p.size};
    case 'lettres': return {k:'lettres',size:p.size,mode:'alpha'};
    case 'empan': return {k:'empan',n:p.n,span:p.span};
    case 'empanV': return {k:'empanV',n:p.n,span:p.span};
    case 'eventail': return {k:'eventail',n:p.n,len:p.len};
    case 'saccades': return {k:'saccades',rounds:p.rounds};
    case 'peripherie': return {k:'peripherie',rounds:p.rounds,dur:p.dur};
    case 'rsvp': return {k:'rsvp',wpm:p.wpm,chunk:p.chunk};
    case 'metronome': return {k:'metronome',wpm:p.wpm,chunk:p.chunk};
    case 'pacer': return {k:'pacer',wpm:p.wpm};
    case 'guide': return {k:'guide',wpm:p.wpm,group:p.group};
    case 'suppression': return {k:'suppression',wpm:p.wpm,chunk:p.chunk};
    case 'ortho': return {k:'ortho',n:p.n};
    default: return {k:kind};
  }
}
function askExoSettings(kind){
  const fields=EXO_CFG[kind];
  const exo=EXOS.find(x=>x.id===kind)||{nom:kind,desc:'',fam:''};
  if(!fields) return Promise.resolve(specFromPrefs(kind,exoDefaults(kind)));
  const p=Object.assign(exoDefaults(kind),(S.exoPrefs&&S.exoPrefs[kind])||{});
  const sheet=$('#sheet'), body=$('#sheetBody');
  $('#sheetKind').textContent='Réglages — '+(exo.fam||'exercice');
  $('#sheetTitle').textContent=exo.nom;
  $('#sheetDesc').textContent=exo.desc||'';
  return new Promise(resolve=>{
    let closed=false;
    const onKey=e=>{ if(e.key==='Escape'){ e.preventDefault(); close(null); } };
    const close=v=>{
      if(closed) return; closed=true;
      sheet.hidden=true;
      document.removeEventListener('keydown',onKey);
      $('#sheetCancel').onclick=null; $('#sheetGo').onclick=null; sheet.onclick=null;
      resolve(v);
    };
    body.innerHTML=fields.map(f=>{
      if(f.type==='range'){
        return `<div class="cfg-row"><div class="cfg-lab"><span>${f.label}</span><b class="mono" data-v="${f.key}">${p[f.key]} ${f.unit||''}</b></div>
          <input type="range" min="120" max="1000" step="10" data-r="${f.key}" value="${p[f.key]}"></div>`;
      }
      return `<div class="cfg-row"><div class="cfg-lab"><span>${f.label}</span></div><div class="cfg-chips" data-g="${f.key}">
        ${f.vals.map(v=>`<button class="chip ${p[f.key]===v?'is-on':''}" data-k="${f.key}" data-v="${v}">${f.fmt?f.fmt(v):v}</button>`).join('')}</div></div>`;
    }).join('');
    body.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{
      const k=b.dataset.k, v=+b.dataset.v; p[k]=v;
      body.querySelectorAll('[data-g="'+k+'"] [data-k]').forEach(x=>x.classList.toggle('is-on',+x.dataset.v===v));
    }));
    body.querySelectorAll('[data-r]').forEach(r=>r.addEventListener('input',()=>{
      const k=r.dataset.r; p[k]=+r.value;
      const lab=body.querySelector('[data-v="'+k+'"]');
      const f=fields.find(x=>x.key===k);
      if(lab) lab.textContent=p[k]+' '+(f&&f.unit||'');
    }));
    document.addEventListener('keydown',onKey);
    $('#sheetCancel').onclick=()=>close(null);
    $('#sheetGo').onclick=()=>{
      S.exoPrefs=Object.assign({},S.exoPrefs||{},{[kind]:p}); save();
      close(specFromPrefs(kind,p));
    };
    sheet.onclick=e=>{ if(e.target===sheet) close(null); };
    sheet.hidden=false;
  });
}
async function askFree(kind){

async function launchFree(kind, missionIdx=null, specOverride=null){
  const lvl=niveauCourant();
  const size=levelIdx()>=3?5:4;
  const spec = specOverride || (kind==='schulte'?{k:'schulte',size}
    : kind==='lettres'?{k:'lettres',size,mode:'alpha'}
    : kind==='empan'?{k:'empan',n:8}
    : kind==='saccades'?{k:'saccades',rounds:3}
    : kind==='peripherie'?{k:'peripherie',rounds:8}
    : kind==='metronome'?{k:'metronome'}
    : kind==='guide'?{k:'guide',group:3}
    : kind==='rappel'?{k:'rappel'}
    : kind==='suppression'?{k:'suppression',wpm:Math.max(250,S.wpm),chunk:1}

  const r=await runSpec(spec,tok,{text,niveau:lvl});

  const rec={ts:Date.now(),mode:kind,label:'Libre — '+specLabel(spec),wpm:r.wpm||null,
    comp:r.comp!=null?r.comp:null,effective:(r.comp!=null&&r.wpm)?r.wpm*r.comp:null,words:r.words||0,seconds:r.seconds||0,span:r.span||null,
    recall:r.recall!=null?r.recall:null,saccades:r.k==='saccades'?r.correct:null,mission:missionIdx!=null?missionIdx:null};
  if(r.k==='schulte'||r.k==='lettres'){ const key=r.size+(r.k==='lettres'?'L':'N'); if(r.completed&&(!S.schulteBest[key]||r.seconds<S.schulteBest[key])) S.schulteBest[key]=r.seconds; }

  // la vitesse ne bouge que sur une lecture mesurée en compréhension

  const lv=niveauInfo();
  setHost();
  host.innerHTML=`<div class="result">
    <span class="eyebrow">${missionIdx!=null?'Mission du jour · tâche '+(missionIdx+1)+'/3':'Exercice libre · ne valide pas l’étape'}</span>
    <h2>${miss&&miss.complete?'Mission accomplie.':'Séance enregistrée'}</h2>
    <div class="result-grid">
      ${r.wpm?`<div><span class="eyebrow">Vitesse</span><b>${Math.round(r.wpm)}</b><small>mots/min</small></div>`:''}
      ${r.comp!=null?`<div><span class="eyebrow">Compréhension</span><b>${Math.round(r.comp*100)}</b><small>%${r.total?' · '+r.correct+'/'+r.total:''}</small></div>
        ${r.k!=='suppression'?`<div class="hi"><span class="eyebrow">Lecture utile</span><b>${Math.round(r.wpm*r.comp)}</b><small>indice, pas une mesure du regard</small></div>`:''}`:''}
      ${r.k==='empan'?`<div><span class="eyebrow">Empan</span><b>${r.span}</b><small>mots</small></div>`:''}
      ${r.k==='saccades'?`<div><span class="eyebrow">Séquences justes</span><b>${r.correct}/${r.total}</b><small>séquences</small></div>`:''}
      ${r.k==='peripherie'?`<div><span class="eyebrow">Périphérie</span><b>${r.correct}/${r.total}</b><small>à ${r.dur} ms</small></div>`:''}
      ${r.k==='suppression'?`<div><span class="eyebrow">Contrôle</span><b>${r.compCtrl!=null?Math.round(r.compCtrl*100):'—'}</b><small>% sans boucle</small></div>
        <div class="hi"><span class="eyebrow">Écart</span><b>${r.gap!=null?(r.gap>0?'−'+r.gap:'+'+Math.abs(r.gap)):'—'}</b><small>points sous boucle</small></div>`:''}

    <div class="result-actions">

      <button class="btn ghost" id="freeBack">Tableau de bord</button></div>

function bumpStreak(){
  const today=dayKey();
  if(S.streak.last===today) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  S.streak.count = S.streak.last===dayKey(y) ? S.streak.count+1 : 1;
  S.streak.last=today;
}
// les passages sous boucle ne comptent pas comme des lectures ordinaires : c'est un diagnostic
function readingSessions(){ return S.history.filter(h=>h.wpm&&h.comp!=null&&h.mode!=='suppression'); }
function avgComp(n=5){ const r=readingSessions().slice(-n); return r.length?r.reduce((a,b)=>a+b.comp,0)/r.length:null; }
function avgEff(n=5){ const r=readingSessions().slice(-n); return r.length?r.reduce((a,b)=>a+(b.effective||0),0)/r.length:null; }

/* ---------- XP, niveaux, mission quotidienne ---------- */
const xpNeed = n => 120 + (n-1)*60;
function niveauInfo(){
  let n=1, rest=Math.max(0,Math.round(S.xp||0));
  while(rest>=xpNeed(n)){ rest-=xpNeed(n); n++; }
  return {n,rest,need:xpNeed(n),pct:Math.round(rest/xpNeed(n)*100)};
}
function addXp(pts){
  const before=niveauInfo().n;
  S.xp=Math.max(0,Math.round((S.xp||0)+pts));
  const after=niveauInfo();
  return {pts, up:after.n>before, level:after.n};
}
function voixRef(wpm){
  const rs=S.history.filter(h=>h.comp!=null&&h.wpm&&h.mode!=='suppression'&&h.wpm>=wpm-40);
  const last=rs.slice(-3);
  if(!last.length) return null;
  return last.reduce((a,b)=>a+b.comp,0)/last.length;
}
// écart de compréhension avec et sans boucle articulatoire : l'indice « voix intérieure »
function recordVoix(compLoop,compCtrl,wpm){
  if(compLoop==null) return null;
  const w=Math.round(wpm||S.wpm);
  if(compCtrl==null){ S.voix={comp:Math.round(compLoop*100),wpm:w,ref:null,gap:null,ts:Date.now()}; save(); return S.voix; }
  S.voix={gap:Math.round((compCtrl-compLoop)*100),ref:Math.round(compCtrl*100),comp:Math.round(compLoop*100),wpm:w,ts:Date.now()};
  save(); return S.voix;
}
function voixText(){
  if(!S.voix) return null;
  if(S.voix.gap==null) return null;
  if(S.voix.gap>0) return '−'+S.voix.gap+' pts sous boucle';
  return '+'+Math.abs(S.voix.gap)+' pts sous boucle';
}

const comboMult = ()=>clamp(S.combo||1,1,3);
function xpFor(r){
  const acc = r.comp!=null ? r.comp : (r.acc!=null ? r.acc : (r.correct!=null&&r.total ? r.correct/r.total : (r.completed?1:0.4)));
  const base = r.comp!=null ? 8+acc*12 : 6+acc*8;
  return Math.max(1, Math.round(base*comboMult()));
}

const MISSION_KINDS={
  vision:['schulte','lettres','saccades','peripherie','empanV','eventail'],
  lecture:['metronome','pacer','rsvp','examen'],
  voix:['suppression','ortho','ortho','suppression'],
  autre:['rappel','empan','lettres']
};
const MISSION_LABEL={
  schulte:['Grille de chiffres','4×4, le plus vite possible'],
  lettres:['Grille de lettres','A → P, sans balayer'],
  saccades:['Saccades guidées','3 séquences à restituer'],
  peripherie:['Vision périphérique','8 lettres hors du centre du regard'],
  metronome:['Métronome deux points','gauche · droite · gauche'],
  pacer:['Lecture guidée','au rythme cible'],
  rsvp:['Flash RSVP','mots par groupes, sans retour'],
  rappel:['Rappel libre','écrire ce qu’on retient'],
  examen:['QCM complet','toutes les questions du texte'],
  empan:['Empan visuel','reconnaître la bonne phrase'],
  empanV:['Empan vertical','colonne de 4 à 7 mots'],
  eventail:['Éventail visuel','nombres flashés, de 2 à 8 chiffres'],
  suppression:['Bouche fermée','lire en répétant ta-ta-ta'],
  ortho:['Lettres muettes','20 mots, 1,5 s chacun']
};
function seedRand(seed){
  let h=2166136261;
  for(const c of String(seed)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); }
  return ()=>{ h^=h<<13; h>>>=0; h^=h>>>17; h^=h<<5; h>>>=0; return (h%100000)/100000; };
}
function missionPlan(){
  const r=seedRand('m'+dayKey()+'/n'+niveauInfo().n);
  const pick=a=>a[Math.floor(r()*a.length)];
  const out=[];
  const add=k=>{ if(!out.includes(k)) out.push(k); };
  add(pick(MISSION_KINDS.vision));
  add(pick(MISSION_KINDS.lecture));
  add(pick(MISSION_KINDS.voix));
  const extra=['pacer','schulte','peripherie','rappel','metronome','suppression','ortho'];
  while(out.length<3) add(pick(extra));
  return out;
}
const MISSION_XP=40;
function missionState(){
  const today=dayKey();
  if(!S.mission||S.mission.day!==today) S.mission={day:today,done:[],xp:0};
  const plan=missionPlan();
  S.mission.done=(S.mission.done||[]).slice(0,3);
  while(S.mission.done.length<3) S.mission.done.push(false);
  return {plan,done:S.mission.done,complete:S.mission.done.every(Boolean),xp:S.mission.xp||0};
}
let missionTask=null;
function markMissionTask(i){
  const st=missionState();
  if(st.done[i]) return {already:true};
  S.mission.done[i]=true; save();
  const after=missionState();
  if(after.complete){
    const y=new Date(); y.setDate(y.getDate()-1);
    S.streak.count = S.streak.last===dayKey(y) ? (S.streak.count||0)+1 : 1;
    S.streak.last=dayKey();
    const bonus=addXp(MISSION_XP);
    S.mission.xp=MISSION_XP; save();
    return {complete:true,bonus:MISSION_XP,streak:S.streak.count,gain:bonus};
  }
  return {complete:false};
}

/* ---------- agrégation journalière ---------- */
function dayStats(){
  const map=new Map();
  S.history.forEach(h=>{
    const k=dayKey(h.ts);
    let d=map.get(k);
    if(!d){ d={day:k,sessions:0,seconds:0,compSum:0,compN:0,effSum:0,effN:0,best:0,steps:[]}; map.set(k,d); }
    d.sessions++;
    d.seconds+=(h.seconds||0);
    if(h.comp!=null){ d.compSum+=h.comp; d.compN++; }
    if(h.effective){ d.effSum+=h.effective; d.effN++; d.best=Math.max(d.best,h.effective); }
    if(h.mode&&String(h.mode).startsWith('etape')) d.steps.push(h.mode);
  });
  return Array.from(map.values()).sort((a,b)=>a.day<b.day?-1:1).map(d=>({
    day:d.day, sessions:d.sessions, seconds:d.seconds,
    comp:d.compN?d.compSum/d.compN:null,
    eff:d.effN?d.effSum/d.effN:null,
    best:d.best, steps:Array.from(new Set(d.steps))
  }));
}
function lastDays(n){
  const by=new Map(dayStats().map(d=>[d.day,d]));
  const out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i);
    const k=dayKey(d);
    out.push(by.get(k)||{day:k,sessions:0,seconds:0,eff:null,comp:null,best:0,steps:[]});
  }
  return out;
}

/* ---------- export / restauration ---------- */
function download(name,text,type){
  try{
    const blob=new Blob([text],{type:type||'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} },500);
  }catch(e){ toast('Export impossible dans ce navigateur'); }
}
function exportJSON(){ download('flashr-sauvegarde.json', JSON.stringify(S,null,2)); toast('Sauvegarde téléchargée'); }
function exportCSV(){
  const head=['date','heure','seance','vitesse_cible','comprehension_pct','vitesse_efficace','mots','secondes'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=S.history.map(h=>{
    const d=new Date(h.ts);
    return [d.toISOString().slice(0,10), d.toTimeString().slice(0,5), h.label||h.mode||'',
      h.wpm!=null?Math.round(h.wpm):'',
      h.comp!=null?Math.round(h.comp*100):'',
      h.effective?Math.round(h.effective):'',
      h.words||0, h.seconds?Math.round(h.seconds):0].map(q).join(';');
  });
  download('flashr-seances.csv', [head.join(';')].concat(rows).join('\n'), 'text/csv;charset=utf-8');
  toast('Séances exportées ('+S.history.length+')');
}
function importJSON(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(String(r.result));
      if(!p||typeof p!=='object'||!Array.isArray(p.history)) throw new Error('format');
      if(!confirm('Remplacer les données actuelles par cette sauvegarde ('+p.history.length+' séances) ?')) return;
      localStorage.setItem(KEY,JSON.stringify(p));
      S=load(); renderAll(); setView('dash'); toast('Sauvegarde restaurée');
    }catch(e){ toast('Fichier illisible ou invalide'); }
  };
  r.onerror=()=>toast('Lecture du fichier impossible');
  r.readAsText(file);
}

function chartSvg(data){
  if(data.length<2) return `<div class="empty">Deux séances de lecture suffisent pour tracer la courbe. La ligne haute sera ta vitesse imposée, la ligne pleine ta vitesse réellement comprise.</div>`;
  const W=640,H=220,P=34;
  const maxV=Math.max(...data.map(d=>Math.max(d.wpm||0,d.effective||0)))*1.12||1;
  const x=i=>P+(i/(data.length-1))*(W-P-14);
  const y=v=>H-P-(v/maxV)*(H-P-16);
  const line=(key)=>data.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d[key]||0).toFixed(1)}`).join(' ');
  const area=data.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(d.effective||0).toFixed(1)}`).join(' ')+` L${x(data.length-1).toFixed(1)},${H-P} L${x(0).toFixed(1)},${H-P} Z`;
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${P}" x2="${W-14}" y1="${y(maxV*f).toFixed(1)}" y2="${y(maxV*f).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  const dots=data.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d.effective||0).toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join('');
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="auto" role="img" aria-label="Évolution de la vitesse imposée et de la vitesse efficace">
      ${grid}
      <path d="${area}" fill="var(--accent-soft)"/>
      <path d="${line('wpm')}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4"/>
      <path d="${line('effective')}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
      ${dots}
      <text x="${P}" y="16" fill="var(--dim)" font-family="ui-monospace, Menlo, monospace" font-size="9">${Math.round(maxV)} mots/min</text>
    </svg>
    <div class="chart-legend"><span><i style="background:var(--accent)"></i>lecture utile</span>
      <span><i style="background:var(--muted)"></i>vitesse imposée</span></div>
  </div>`;
}

function weekStrip(n=7){
  const days=lastDays(n);
  const max=Math.max(...days.map(d=>d.eff||0),1);
  const today=dayKey();
  return `<div class="week">${days.map(d=>{
    const lbl=new Date(d.day+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'narrow'});
    const pct=d.eff?Math.max(4,Math.round(d.eff/max*100)):0;
    return `<div class="wday${d.day===today?' today':''}${d.sessions?' has':''}" title="${esc(dayLabel(d.day))} — ${d.eff?Math.round(d.eff)+' mots/min compris':''}${d.sessions?' · '+d.sessions+' séance'+(d.sessions>1?'s':''):''}">
      <span class="wk">${lbl}</span>
      <span class="wbar"><i style="height:${pct}%"></i></span>
      <span class="wval">${d.eff?Math.round(d.eff):''}</span>
    </div>`;
  }).join('')}</div>
  <div class="chart-legend" style="padding-left:2px"><span>7 derniers jours · vitesse efficace moyenne</span><span class="mono">${days.filter(d=>d.sessions).length} jour${days.filter(d=>d.sessions).length>1?'s':''} actif${days.filter(d=>d.sessions).length>1?'s':''}</span></div>`;
}

function barsSvg(days){
  const withData=days.filter(d=>d.eff);
  if(!withData.length) return `<div class="empty">Aucune journée mesurée. Dès la première séance, chaque journée apparaîtra ici avec sa moyenne.</div>`;
  const W=640,H=200,P=32;
  const max=Math.max(...days.map(d=>d.eff||0),1)*1.15;
  const step=(W-P-12)/days.length;
  const bw=Math.max(6,Math.min(30,step*0.62));
  const bars=days.map((d,i)=>{
    if(!d.eff) return '';
    const h=(d.eff/max)*(H-P-18);
    const x=P+i*step+(step-bw)/2;
    return `<g>
      <rect x="${x.toFixed(1)}" y="${(H-P-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="var(--accent)" opacity="${d.day===dayKey()?1:.72}"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${(H-P-h-5).toFixed(1)}" text-anchor="middle" fill="var(--muted)" font-family="ui-monospace, Menlo, monospace" font-size="9">${Math.round(d.eff)}</text>
    </g>`;
  }).join('');
  const labels=days.map((d,i)=>{
    if(i%Math.ceil(days.length/7)!==0 && i!==days.length-1) return '';
    const x=P+i*step+step/2;
    return `<text x="${x.toFixed(1)}" y="${H-10}" text-anchor="middle" fill="var(--dim)" font-family="ui-monospace, Menlo, monospace" font-size="8.5">${dayLabel(d.day).replace(' ','').slice(0,6)}</text>`;
  }).join('');
  const grid=[0,.5,1].map(f=>`<line x1="${P}" x2="${W-12}" y1="${(H-P-(H-P-18)*f).toFixed(1)}" y2="${(H-P-(H-P-18)*f).toFixed(1)}" stroke="var(--line)"/>`).join('');
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="auto" role="img" aria-label="Vitesse efficace moyenne par jour">
      ${grid}${bars}${labels}
      <text x="${P}" y="14" fill="var(--dim)" font-family="ui-monospace, Menlo, monospace" font-size="9">${Math.round(max)} mots/min compris</text>
    </svg>
  </div>`;
}

function renderGuide(){
  renderRail();
  $('#view-guide').innerHTML=`
    <div class="statusbar">
      <div class="sb"><span class="eyebrow">Parcours</span><b>${ETAPES.length}</b><small>étapes séquentielles</small></div>
      <div class="sb"><span class="eyebrow">Blocage</span><b>Aucun</b><small>la vitesse s'ajuste seule</small></div>
      <div class="sb"><span class="eyebrow">Mesure clé</span><b>Efficace</b><small>mots/min compris</small></div>
    </div>
    <div class="grid-main">
      <div class="prose">
        <h2>Le principe</h2>
        <p>La lecture rapide n'est pas un chronomètre : c'est un compromis. Lire à 400 mots/min en ne retenant rien n'a aucune valeur. Ici, chaque lecture est suivie de questions, et la seule note qui compte est la <strong style="color:var(--ink)">lecture utile</strong> : débit × compréhension. C'est un <em>indice</em>, pas une mesure du regard — il compare des séances, il ne mesure pas les mouvements oculaires.</p>
        <p class="note">À 280 mots/min avec 75 % de compréhension, l'indice vaut 210. À 200 avec 100 %, il vaut 200. Le second profil est plus solide — et il progressera plus loin.</p>

        <h2>Le jeu : mission, série, XP</h2>
        <ul>
          <li><strong style="color:var(--ink)">Mission du jour</strong> — trois exercices tirés au sort chaque jour (un visuel, un rythmique, un de voix intérieure), environ huit minutes. Elle se termine quand les trois sont faits, pas quand tu en lances un.</li>
          <li><strong style="color:var(--ink)">Série</strong> — elle n'avance que sur une mission terminée. Abandonner un exercice ne casse rien, mais ne compte pas.</li>
          <li><strong style="color:var(--ink)">XP et niveaux</strong> — 8 à 20 XP par exercice selon la justesse, ×2 ou ×3 quand tu enchaînes les bonnes réponses dans un même quiz. Le niveau monte lentement : ~120 XP pour le deuxième niveau, puis davantage.</li>
          <li><strong style="color:var(--ink)">Contre le farming</strong> — refaire vingt fois la grille de chiffres rapporte peu : le gain dépend de la compréhension et de la série, pas du nombre de clics.</li>
        </ul>

        <h2>La voix intérieure : la bouche et l'oreille</h2>
        <p>La plupart des lecteurs lents « disent » ce qu'ils lisent : une voix intérieure articule les mots et une oreille interne les écoute. C'est la <em>subvocalisation</em>. Elle n'est pas un défaut — elle aide à comprendre un texte difficile — mais elle plafonne la lecture au débit de la parole, environ 250 à 300 mots/min. Pour aller plus vite sans perdre le sens, il faut lire par les yeux : la forme écrite accède directement au sens, sans passer par le son.</p>
        <ul>
          <li><strong style="color:var(--ink)">Bouche fermée</strong> — deux textes à la même cadence : un <em>contrôle</em> lu normalement, puis le même exercice en répétant mentalement « ta-ta-ta » au rythme d'un repère. Cette boucle occupe la voix intérieure : si tu comprends encore, c'est que tu n'en avais pas besoin. C'est la <em>suppression articulatoire</em>, la technique classique pour faire taire la voix. L'écart entre les deux passages est l'indice qui compte : sous 25 points (une question sur quatre), la lecture commence à se passer du son.</li>
          <li><strong style="color:var(--ink)">Lettres muettes</strong> — un mot s'affiche 1,5 s : a-t-il une lettre muette ? Impossible de répondre en l'entendant (« tabac », « doigt », « poids »), il faut voir l'orthographe. Tu entraînes l'accès direct à la forme écrite, et la médiane de réponse dit à quelle vitesse cet accès se fait.</li>
          <li><strong style="color:var(--ink)">Ce que mesure l'indice « voix intérieure »</strong> — l'écart de compréhension entre tes lectures normales et tes lectures sous boucle, à vitesse comparable. Un écart qui se réduit sur plusieurs semaines veut dire que la lecture se détache du son. Un écart important veut dire que la voix porte encore le sens chez toi : ce n'est pas une faute, c'est l'étape en cours.</li>
        </ul>
        <p class="note">Sans micro ni électrodes sur la gorge, rien ici ne mesure l'articulation réelle : l'écart de compréhension est un <em>indice indirect</em>, et l'auto-observation n'est pas notée. On ne cherche pas le silence total — sur un texte dense ou technique, la voix reste utile. L'objectif est de pouvoir s'en passer quand on veut aller vite.</p>

        <h2>Les pauses des yeux</h2>
        <p>Lire sur un écran, c'est accommoder en permanence à 50 cm : le muscle ciliaire ne se relâche plus, et on cligne deux à trois fois moins. La règle classique est 20-20-20 — toutes les 20 minutes, regarder à 6 mètres pendant 20 secondes — mais elle suppose qu'on y pense. Ici, l'app le fait à ta place : une pause s'ouvre <strong style="color:var(--ink)">entre deux exercices</strong> (jamais au milieu d'un quiz), toutes les 4 minutes pour un débutant et toutes les 7 pour un lecteur plus avancé. Le bouton « 20 secondes » du tableau de bord les ouvre à la demande, et les pauses automatiques se coupent dans les réglages.</p>
        <ul>
          <li><strong style="color:var(--ink)">Regarde au loin</strong> — un point à plus de six mètres, 20 s. C'est le relâchement de l'accommodation.</li>
          <li><strong style="color:var(--ink)">Cligne lentement</strong> — dix clignements complets, 15 s. Le film lacrymal se reforme.</li>
          <li><strong style="color:var(--ink)">Paumes sur les yeux</strong> — 20 s dans le noir, sans appuyer (palming).</li>
          <li><strong style="color:var(--ink)">Près / loin</strong> — huit allers-retours entre un doigt à 40 cm et un point lointain, 25 s.</li>
        </ul>
        <p class="note">Aucune de ces méthodes ne « répare » la vue ni ne soigne quoi que ce soit : elles réduisent la fatigue oculaire de l'écran. Si tu portes des lunettes ou as une correction, garde-la pendant les exercices.</p>

        <h2>Les textes</h2>
        <p>${TEXTS.length} textes, cinq niveaux, du plus court au plus dense (de 180 à 1500 mots), sur une douzaine de thèmes : sciences, nature, histoire, géographie, arts, technologie, société, santé, sport, cuisine, espace, animaux, architecture, économie. Chaque texte est livré avec <strong style="color:var(--ink)">15 à 27 questions</strong> — faits explicites, inférences, idée principale — avec trois options et une explication après chaque réponse.</p>
        <ul>
          <li>Le tirage est <strong style="color:var(--ink)">aléatoire par niveau</strong>, jamais les six derniers textes vus, et toujours celui que tu as le moins lu dans la pile : la redondance devient rare.</li>
          <li>Après une lecture chronométrée (Flash, guidée, métronome, boucle fermée), l'app pose <strong style="color:var(--ink)">4 à 7 questions tirées au hasard</strong> : à 300 mots/min, un QCM de 20 questions mesurerait la patience, pas la compréhension.</li>
          <li>L'exercice <strong style="color:var(--ink)">Lecture + QCM complet</strong> lit un texte à ton rythme puis pose <em>toutes</em> ses questions : c'est le test de compréhension sans chronomètre.</li>
          <li>Pour ajouter des textes : le fichier <code>textes.js</code> contient la bibliothèque, <code>textes/SPEC.md</code> décrit le schéma, et <code>node textes/valide-biblio.js textes.js</code> vérifie longueurs, nombre de questions, options et doublons.</li>
        </ul>
        <p class="note">Bibliothèque actuelle : ${BIBLIO_SRC==='secours'?'textes de secours (bibliothèque externe absente)':'textes.js'}. Aucun texte n'est téléchargé : tout est dans le fichier.</p>

        <h2>Le parcours, étape par étape</h2>
        <p>${ETAPES.length} étapes, dans l'ordre. Elles commencent par l'outil (le champ visuel, les fixations), passent par le rythme et la prise de groupes, puis par la voix intérieure et enfin la vitesse. Chacune a un objectif, deux ou trois exercices imposés, et un critère de passage chiffré. Tant que le critère n'est pas atteint, l'étape se refait : c'est normal, la régularité compte plus que le record.</p>
        <ul>${ETAPES.map(e=>`<li><strong style="color:var(--ink)">${e.id}. ${esc(e.nom)}</strong> — ${esc(e.but)} <span class="mono" style="font-size:11px;color:var(--dim)">(${e.cible} mots/min)</span></li>`).join('')}</ul>

        <h2>Comment la vitesse bouge</h2>
        <ul>
          <li>3 ou 4 bonnes réponses sur 4 et rythme supportable → <code>+20 mots/min</code></li>
          <li>3 sur 4 mais rythme éprouvant, ou 2 sur 4 → la vitesse ne bouge pas</li>
          <li>moins de 2 sur 4 → <code>−20 mots/min</code>, on reconstruit la saisie</li>
          <li>chaque étape impose un plancher : elle ne peut pas démarrer en dessous de sa cible</li>
          <li>seules les lectures avec questions déplacent la vitesse : une grille, des saccades ou un empan réussi ne la font pas monter</li>
          <li>le plancher d'une étape ne s'applique qu'une fois : une baisse gagnée (mauvaise compréhension) n'est pas effacée au lancement suivant</li>
        </ul>
        <p>Tu peux forcer la vitesse à la main dans les réglages, mais l'adaptation automatique reprend la main à la séance suivante. C'est volontaire : le curseur doit rester honnête.</p>

        <h2>Les exercices et ce qu'ils travaillent</h2>
        <p><strong style="color:var(--ink)">Lecture</strong> — la saisie et le rythme.</p>
        <ul>
          <li><strong style="color:var(--ink)">Flash RSVP</strong> — un mot à huit mots à la fois, ancré sur un point fixe : le groupe grandit avec ton palier de vitesse (2 mots à 300 mots/min, 4 à 520, 6 à 800, 8 à 1000). Supprime le retour oculaire et réduit la subvocalisation.</li>
          <li><strong style="color:var(--ink)">Lecture guidée</strong> — un curseur vertical balaie la ligne à vitesse constante et le texte lu <em>disparaît</em> : pas de point de fixation, pas de retour, aucune relecture — seulement le flux.</li>
          <li><strong style="color:var(--ink)">Métronome deux points</strong> — deux points de fixation, à gauche et à droite de l'écran : les groupes de mots s'allument alternativement à l'un puis à l'autre, au rythme du battement. L'œil doit traverser tout le champ à chaque temps, sans s'arrêter au milieu. Le groupe suit le même réglage que le Flash (« mots par affichage », de 1 à 8) et grandit donc tout seul avec ton palier de vitesse.</li>
          <li><strong style="color:var(--ink)">Lecture + rappel libre</strong> — tu écris ce que tu retiens, la couverture des idées clés est estimée par recoupement lexical.</li>
        </ul>
        <p><strong style="color:var(--ink)">Fixations et vision</strong> — l'outil optique, avant la vitesse.</p>
        <ul>
          <li><strong style="color:var(--ink)">Grille de chiffres</strong> — 1, 2, 3… à cliquer dans l'ordre, sans balayer. Élargit le champ utile.</li>
          <li><strong style="color:var(--ink)">Grille de lettres</strong> — A, B, C… dans l'ordre. Même exercice sans l'appui de la suite numérique : la recherche est plus coûteuse, donc plus révélatrice.</li>
          <li><strong style="color:var(--ink)">Saccades guidées</strong> — des lettres apparaissent brièvement sur des repères fixes ; tu dois restituer la séquence. Entraîne la précision du saut d'un point à l'autre, pas la vitesse de lecture.</li>
          <li><strong style="color:var(--ink)">Indicateur visuel</strong> — une barre marque où poser le regard, un point tous les trois mots. Tu ne lis qu'entre deux points, puis tu sautes. C'est la fixation groupée, celle qui fait vraiment gagner des mots par minute.</li>
          <li><strong style="color:var(--ink)">Vision périphérique</strong> — le regard reste sur une croix centrale, une lettre est flashée sur le côté puis masquée. Ce que tu identifies hors du centre, sans bouger les yeux, est mesuré ; la durée d'exposition s'ajuste seule.</li>
          <li><strong style="color:var(--ink)">Empan visuel</strong> — une phrase flashée, trois variantes proches : tu dois reconnaître la bonne. Mesure combien de mots ton œil saisit d'un coup, horizontalement.</li>
          <li><strong style="color:var(--ink)">Empan vertical</strong> — une colonne de 4 à 7 mots, deux flèches au centre : tu fixes le milieu et la colonne se lit d'un seul regard vertical. On mesure la hauteur du champ, pas la largeur — c'est ce qui compte pour descendre une page sans balayer.</li>
          <li><strong style="color:var(--ink)">Éventail visuel</strong> — un nombre s'affiche une fraction de seconde puis disparaît, et tu le retapes. Deux chiffres au départ, huit au plus haut, et plus le nombre est long moins il reste affiché : deux chiffres 420 ms, huit chiffres 180 ms. Trois réussites d'affilée allongent le nombre, deux échecs le raccourcissent. L'idée est celle du livre : réduire la durée de fixation tout en augmentant ce qui est pris à chaque fixation.</li>
        </ul>

        <h2>L'historique et la progression journalière</h2>
        <p>Chaque séance est enregistrée dans ce navigateur (date, vitesse, compréhension, vitesse efficace). La vue <em>Progression</em> agrège ces séances <strong style="color:var(--ink)">par jour</strong> : moyenne de vitesse efficace, temps de pratique, écart avec la journée précédente, et le nombre de jours actifs. La bande des sept derniers jours sur le tableau de bord donne la même information d'un coup d'œil.</p>
        <p>Trois nuances à garder en tête : la moyenne du jour mélange les exercices faciles et difficiles, une journée sans séance ne fait pas baisser la courbe (elle disparaît), et l'écart journalier bouge beaucoup — c'est la tendance sur deux semaines qui compte. Les boutons d'export (CSV pour les séances, JSON pour la sauvegarde complète) servent à garder les mesures si tu changes de navigateur ou vides le cache.</p>

        <h2>Ce que cette app ne fait pas</h2>
        <ul>
          <li>Le score de rappel libre est une <em>estimation</em> par mots-clés, pas une correction sémantique : une reformulation juste avec d'autres mots peut être sous-notée.</li>
          <li>Quatre questions par texte, c'est un échantillon. Une bonne série ne prouve pas une compréhension profonde.</li>
          <li>Rien ici n'est un test clinique ou scolaire. Aucune donnée n'est envoyée : tout reste dans le navigateur.</li>
          <li>La compréhension d'un texte difficile dépend d'abord du vocabulaire et du sujet — pas de la vitesse des yeux.</li>
          <li>Sans oculométrie, rien ici ne mesure les mouvements oculaires réels : « fixations », « saccades » et « anti-régression » sont des tâches attentionnelles qui les sollicitent, pas des mesures du regard.</li>
          <li>Les QCM mélangent leurs options à chaque passage, et les textes tournent par ordre d'utilisation — mais dix textes ne remplacent pas une bibliothèque : relire un texte déjà vu reste possible et biaise une mesure.</li>
        </ul>

        <h2>Trois conseils qui changent plus que l'exercice</h2>
        <ul>
          <li>Lis à la même heure, 10 minutes, tous les jours. Trois séances de 10 minutes valent mieux qu'une de 30.</li>
          <li>Ne reviens jamais en arrière pendant un exercice. La régression est le premier frein mesurable.</li>
          <li>Termine par une lecture réelle, hors application, à la vitesse du jour. C'est le seul transfert qui compte.</li>
        </ul>
      </div>
      <div class="stack">
        <div class="panel">
          <div class="panel-h"><h2>Où j'en suis</h2></div>
          <div class="mini-stats">
            <div><b>${currentEtapeIdx()+1}/${ETAPES.length}</b><small>étape courante</small></div>
            <div><b>${S.wpm}</b><small>mots/min cible</small></div>
            <div><b>${avgComp(5)!=null?Math.round(avgComp(5)*100)+' %':'—'}</b><small>compréhension</small></div>
            <div><b>${avgEff(5)!=null?Math.round(avgEff(5)):'—'}</b><small>vitesse efficace</small></div>
          </div>
          <button class="btn primary" style="margin-top:14px" id="guideStart">Reprendre le parcours</button>
        </div>
      </div>
    </div>`;
  $('#guideStart').addEventListener('click',()=>{ setView('dash'); launchEtape(currentEtapeIdx()); });
}

function renderAll(){ renderRail(); if(!$('#view-dash').hidden) renderDash(); if(!$('#view-progress').hidden) renderProgress(); if(!$('#view-guide').hidden) renderGuide(); }

/* =========================================================
   8. INIT
   ========================================================= */
$$('.nav-item').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('#railRange').addEventListener('input',e=>{
  S.wpm=+e.target.value; $('#railWpm').textContent=S.wpm; save();
  if(!$('#view-dash').hidden) renderDash();
});
$('#themeBtn').addEventListener('click',()=>{ S.theme=S.theme==='ink'?'paper':'ink'; save(); renderAll(); });
$('#sizeBtn').addEventListener('click',()=>{ const sizes=[1,1.14,1.28]; S.size=sizes[(sizes.indexOf(S.size)+1)%3]; save(); renderAll(); });
$('#orpBtn').addEventListener('click',()=>{ S.orp=!S.orp; save(); renderAll(); });
$('#stageExit').addEventListener('click',()=>{ endStage(); });
$('#stageRestart').addEventListener('click',()=>restartRun());
document.addEventListener('keydown',e=>{
  if(stageEl.hidden) return;
  const t=e.target;
  const inField = !!(t && typeof t.closest==='function' && t.closest('button,textarea,input,select'));
  if(e.key==='Escape'){ e.preventDefault(); endStage(); }
  if(e.code==='Space'&&!inField){ e.preventDefault(); paused=!paused; const st=$('#paceState'); if(st) st.textContent=paused?'pause':'lecture'; toast(paused?'Pause':'Reprise',800); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&!stageEl.hidden) paused=true; });

renderAll();
setView('dash');
</script>
