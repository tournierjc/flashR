<!doctype html>
<html lang="fr" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>flashR — parcours progressif de lecture rapide</title>
<style>
[hidden]{display:none !important}
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#141210; --bg-2:#100e0c; --surface:#1a1714; --surface-2:#211d18; --surface-3:#282219;
  --line:#322b23; --line-2:#453b30;
  --ink:#f2ece1; --muted:#a79b8b; --dim:#8d8171;
  --accent:#d9f45f; --accent-ink:#15130e; --accent-soft:rgba(217,244,95,.12);
  --warn:#e6854f; --ok:#8adaa9;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --tscale:1;
}
[data-theme="paper"]{
  --bg:#f3eee2; --bg-2:#ece5d5; --surface:#fbf8f0; --surface-2:#efe8d9; --surface-3:#e7dfcc;
  --line:#d8cdb7; --line-2:#c3b59a;
  --ink:#1f1b15; --muted:#5f5749; --dim:#6e6656;
  --accent:#2c6650; --accent-ink:#f7f3e8; --accent-soft:rgba(44,102,80,.10);
  --warn:#a4482c; --ok:#2c6650;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:500;letter-spacing:-.012em;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);display:block}
.hint{color:var(--muted);font-size:13.5px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:26px;padding:24px 20px;
  background:var(--bg-2);border-right:1px solid var(--line)}
.brand{display:flex;gap:11px;align-items:center}
.brand-mark{width:34px;height:34px;border:1px solid var(--line-2);display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--accent)}
.brand-name{font-family:var(--serif);font-size:16px;line-height:1.1}
.brand-sub{font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid transparent;border-radius:2px;
  font-size:13.5px;color:var(--muted);min-height:40px}
.nav-item:hover{background:var(--surface);color:var(--ink)}
.nav-item.is-active{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.nav-item.is-active .nav-i{color:var(--accent)}
.nav-i{font-size:9.5px;letter-spacing:.1em;color:var(--dim)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.dial{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:9px}
.dial-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dial-num{font-size:22px;letter-spacing:-.02em;color:var(--ink)}
.dial-row.small{font-size:10.5px;color:var(--dim);font-family:var(--mono);letter-spacing:.04em}
input[type=range]{width:100%;accent-color:var(--accent);height:22px}
.rail-toggles{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);padding:5px 9px;font-size:11px;color:var(--muted);border-radius:2px;
  font-family:var(--mono);letter-spacing:.04em;min-height:28px}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip.is-on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:30px 36px 90px;max-width:1320px;width:100%}

/* ---------- shared pieces ---------- */
.statusbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:26px}
.sb{background:var(--surface);padding:12px 14px}
.sb b{font-family:var(--mono);font-size:20px;font-weight:400;letter-spacing:-.02em;display:block;margin-top:3px}
.sb small{color:var(--muted);font-size:11.5px}
.panel{border:1px solid var(--line);background:var(--surface);padding:18px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.panel-h h2{font-size:17px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:22px;align-items:start}
.stack{display:flex;flex-direction:column;gap:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--line-2);
  font-size:13.5px;border-radius:2px;min-height:42px;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.ghost{color:var(--muted);border-color:transparent;padding:8px 10px;min-height:36px}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-btn{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;
  padding:13px 4px;border-bottom:1px solid var(--line)}
.row-btn:last-child{border-bottom:0}
.row-btn:hover{background:var(--surface-2)}
.row-num{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;padding-top:4px}
.row-body b{font-weight:500;font-size:14px;display:block}
.row-body span{color:var(--muted);font-size:12.5px;display:block;margin-top:2px;max-width:60ch}
.row-meta{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:right;white-space:nowrap}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line-2);padding:1px 5px;color:var(--dim);margin-left:6px;border-radius:2px}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.tag.now{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* ---------- parcours ---------- */
.etape-card{border:1px solid var(--line-2);background:linear-gradient(0deg,var(--surface-2),var(--surface));padding:22px}
.etape-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}
.etape-title{font-size:clamp(22px,3vw,30px);margin-top:4px}
.etape-but{color:var(--muted);font-size:13.5px;max-width:52ch;margin-top:6px}
.etape-cible{text-align:right;flex:none}
.etape-cible b{font-family:var(--mono);font-size:26px;font-weight:400;display:block;line-height:1}
.blocks{display:flex;flex-direction:column;border-top:1px solid var(--line);margin:16px 0}
.block-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:13.5px}
.block-row .bi{font-family:var(--mono);font-size:10px;color:var(--accent);width:16px}
.block-row .bt{color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em}
.crit{border:1px solid var(--line);padding:12px 14px;background:var(--bg-2);margin-bottom:16px}
.crit li{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:3px 0;color:var(--muted)}
.crit li .mk{font-family:var(--mono);font-size:11px;color:var(--dim);width:12px;flex:none;padding-top:2px}
.crit li.ok{color:var(--ink)}
.crit li.ok .mk{color:var(--accent)}
.crit li .val{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap;padding-left:8px}
.ladder{display:flex;flex-direction:column}
.ladder-row{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:9px 2px;
  border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.ladder-row:last-child{border-bottom:0}
.ladder-row .ln{font-family:var(--mono);font-size:10px;width:18px;color:var(--dim)}
.ladder-row .ls{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.ladder-row.done{color:var(--ink)}
.ladder-row.done .ln{color:var(--ok)}
.ladder-row.now{color:var(--ink);background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent);padding-left:8px}
.ladder-row.now .ln{color:var(--accent)}
.ladder-row.locked{opacity:.5}

/* ---------- chart / table ---------- */
.chart-wrap{border:1px solid var(--line);background:var(--bg-2);padding:10px 8px 4px}
.chart-legend{display:flex;gap:14px;font-family:var(--mono);font-size:9.5px;color:var(--dim);
  letter-spacing:.06em;padding:6px 8px 2px;text-transform:uppercase}
.chart-legend i{display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:middle}
table.sess{width:100%;border-collapse:collapse;font-size:12.5px}
table.sess th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  text-align:right;padding:7px 8px;border-bottom:1px solid var(--line-2);font-weight:400}
table.sess th:first-child,table.sess td:first-child{text-align:left}
table.sess td{padding:8px;border-bottom:1px solid var(--line);text-align:right;color:var(--muted)}
table.sess td.n{font-family:var(--mono);color:var(--ink)}
table.sess tr:hover td{background:var(--surface-2)}
.empty{border:1px dashed var(--line-2);padding:26px;text-align:center;color:var(--dim);font-size:13px}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.mini-stats div{padding:10px 0 10px 0;border-bottom:1px solid var(--line)}
.mini-stats div:nth-child(odd){padding-right:12px}
.mini-stats b{font-family:var(--mono);font-size:17px;font-weight:400;display:block}
.mini-stats small{color:var(--dim);font-size:11px}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.stage-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 20px;
  border-bottom:1px solid var(--line);flex:none}
.stage-title{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stage-host{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px 22px;overflow:auto;min-height:0}
.stage-host.top{align-items:stretch;justify-content:flex-start}
.block{width:100%;max-width:760px;margin:0 auto}
.block-head{text-align:center;margin-bottom:22px}
.block-head h2{font-size:clamp(19px,2.4vw,25px);margin:6px 0 6px}
.block-head p{color:var(--muted);font-size:13px;max-width:52ch;margin:0 auto}
.block-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;
  border-top:1px solid var(--line);padding-top:12px}

.countdown{font-family:var(--mono);font-size:clamp(60px,14vw,130px);color:var(--accent);line-height:1;
  font-variant-numeric:tabular-nums}
.cd-label{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}

.rsvp-zone{display:flex;align-items:center;justify-content:center;height:clamp(180px,34vh,300px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;position:relative}
.rsvp-zone::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.rsvp-word{position:relative;display:inline-block;white-space:nowrap;font-family:var(--serif);
  font-size:clamp(2.4rem,7vw,4.6rem);line-height:1;will-change:transform}
.rsvp-word .o{color:var(--accent)}
.rsvp-word .l,.rsvp-word .r{color:var(--ink)}
.read-progress{height:2px;background:var(--line);width:100%;max-width:760px;margin:0 auto 0;overflow:hidden}
.read-progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .09s linear}
.read-foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding-top:10px;max-width:760px;margin:0 auto}

.pacer-wrap{max-height:58vh;overflow:hidden;position:relative;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:16px 0}
.read-text{font-family:var(--serif);font-size:calc(19px * var(--tscale));line-height:1.72;
  color:var(--muted);max-width:64ch;margin:0 auto}
.read-text .pw{transition:color .06s linear,background .06s linear}
.read-text .pw.on{color:var(--accent-ink);background:var(--accent);border-radius:1px;padding:1px 2px;margin:0 -2px}
.read-text.static{color:var(--ink)}
.read-text .mark{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}

/* quiz */
.quiz{width:100%;max-width:720px}
.quiz-q{font-size:clamp(18px,2.3vw,23px);margin:10px 0 20px;line-height:1.35}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:13px 14px;border:1px solid var(--line);
  background:var(--surface);font-size:14px;border-radius:2px;min-height:48px;transition:border-color .1s,background .1s}
.opt:hover{border-color:var(--line-2);background:var(--surface-2)}
.opt .ok-k{font-family:var(--mono);font-size:10px;color:var(--dim);padding-top:3px}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.opt.bad{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.opt.dim{opacity:.45}
.quiz-fb{margin-top:16px;border-left:2px solid var(--accent);padding:8px 0 8px 14px;font-size:13px;color:var(--muted)}
.quiz-fb b{color:var(--ink);font-weight:500}

/* schulte */
.schulte{display:grid;gap:6px;width:min(100%,440px);margin:0 auto}
.schulte button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);
  font-size:clamp(13px,2.4vw,19px);color:var(--ink);display:grid;place-items:center;border-radius:2px;
  transition:background .08s,color .08s,border-color .08s}
.schulte button:hover{border-color:var(--line-2)}
.schulte button.done{color:var(--dim);border-color:transparent;background:transparent}
.schulte.novice button.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.schulte button.okflash{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 34%,transparent)}
.schulte button.miss{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.schulte-meta .err{color:var(--dim)}
.schulte-meta .err:not(:empty){font-variant-numeric:tabular-nums}
.schulte button.next-hint{color:var(--accent);border-color:var(--accent)}
.schulte-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
  letter-spacing:.08em;color:var(--dim);margin-top:14px;text-transform:uppercase}

/* empan */
.empan-stage{display:grid;place-items:center;min-height:clamp(160px,26vh,240px);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);text-align:center;padding:12px}
.empan-phrase{font-family:var(--serif);font-size:calc(clamp(1.5rem,3.6vw,2.5rem) * var(--tscale));line-height:1.3}
.empan-phrase.blank{color:transparent}
.empan-phrase.reveal{color:var(--ink)}
.empan-opts{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.empan-opts .opt{font-family:var(--serif);font-size:calc(16px * var(--tscale))}
.empan-score{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

/* éventail visuel : un nombre flashé, à restituer au clavier */
.fan-stage{display:grid;place-items:center;min-height:clamp(160px,26vh,240px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:4px}
.fan-num{font-family:var(--mono);font-size:calc(clamp(2.2rem,6.5vw,4.2rem) * var(--tscale));letter-spacing:.14em;line-height:1;white-space:nowrap;font-weight:500}
.fan-num.blank{color:transparent}
.fan-input-wrap{display:flex;justify-content:center;margin-top:22px}
.fan-input{font-family:var(--mono);font-size:calc(clamp(1.6rem,4.6vw,2.6rem) * var(--tscale));letter-spacing:.2em;text-align:center;background:transparent;border:0;border-bottom:2px solid var(--line);color:var(--ink);width:min(100%,10ch);padding:6px 4px 8px;outline:none}
.fan-input:focus{border-bottom-color:var(--accent)}
.fan-reveal{display:flex;justify-content:center;gap:.3em;font-family:var(--mono);font-size:calc(clamp(1.5rem,4.2vw,2.3rem) * var(--tscale));letter-spacing:0;margin-top:16px;min-height:1em}
.fan-reveal i{font-style:normal;font-weight:500}
.fan-reveal i.ok{color:var(--accent)}
.fan-reveal i.no{color:var(--warn)}

/* feuille de réglages d'un exercice */
.sheet{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(12,10,9,.72)}
.sheet-card{width:min(94vw,520px);max-height:88vh;overflow:auto;background:var(--paper);border:1px solid var(--line2);padding:22px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.sheet-head h2{margin:4px 0 6px;font-size:21px}
.sheet-head p{margin:0;color:var(--dim);font-size:13px;line-height:1.5}
.sheet-body{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.cfg-row{border-top:1px solid var(--line);padding-top:12px}
.cfg-lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cfg-lab b{color:var(--ink);font-size:13px;letter-spacing:0}
.cfg-chips{display:flex;gap:6px;flex-wrap:wrap}
.cfg-row input[type=range]{width:100%}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}

/* métronome */
.metro{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-top:4px}
.metro-top{display:flex;align-items:center;gap:14px;font-size:10px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
.metro-beat{width:12px;height:12px;border:1px solid var(--accent);display:inline-block;transition:background .05s}
.metro-beat.on{background:var(--accent)}
.metro-top span:nth-child(2){margin-left:auto}
.metro-read{min-height:clamp(120px,22vh,180px);display:flex;align-items:center;justify-content:center;padding:8px 0}
.metro-word{font-family:var(--serif);font-size:calc(clamp(1.6rem,4vw,2.9rem) * var(--tscale));line-height:1.15;letter-spacing:-.01em;text-align:center;white-space:nowrap}
/* un groupe de mots se lit d'une fixation : il ne se coupe jamais sur deux lignes */
.rsvp-word,.metro-word,.supp-word,.empan-phrase,.guide-text .grp{white-space:nowrap}
.grp{display:inline-block}
.supp{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-top:4px}
.supp-top{display:flex;align-items:center;gap:14px;font-size:10px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
#suppTa{font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:.14em;display:inline-block;min-width:2.4em;transition:color .05s,transform .05s}
#suppTa.on{color:var(--accent);transform:scale(1.22)}
.supp-top #suppCount{margin-left:auto}
.supp-read{min-height:clamp(120px,22vh,180px);display:flex;align-items:center;justify-content:center;padding:8px 0}
.supp-word{font-family:var(--serif);font-size:calc(clamp(1.7rem,4.4vw,3.1rem) * var(--tscale));line-height:1.15}
.ortho-stage{display:grid;place-items:center;min-height:clamp(120px,20vh,170px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:10px 0}
.ortho-word{font-family:var(--serif);font-size:calc(clamp(2rem,5vw,3.2rem) * var(--tscale));letter-spacing:-.01em;transition:color .12s}
.ortho-word.good{color:var(--ok)}
.ortho-word.bad{color:var(--warn)}

/* pause des yeux */
.eyebreak{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;padding:24px;
  background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(6px)}
.eb-card{max-width:520px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.eb-card h2{font-family:var(--serif);font-size:clamp(1.5rem,3.4vw,2.2rem);margin:0;letter-spacing:-.01em}
.eb-card p{margin:0;color:var(--dim);font-size:14px;line-height:1.55;max-width:44ch}
.eb-time{display:flex;align-items:baseline;gap:8px;margin:4px 0 2px}
.eb-time b{font-family:var(--mono);font-size:clamp(2.4rem,7vw,3.6rem);font-weight:400;color:var(--accent)}
.eb-time small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.eb-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pause-card{border:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.pause-card .pc-t{flex:1;min-width:200px}
.pause-card b{font-size:13px;font-weight:400;display:block}
.pause-card small{color:var(--dim);font-size:11.5px}

/* indicateur visuel */
.guide-wrap{position:relative;max-height:52vh;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0 24px;margin-top:4px}
.guide-text .pw{color:var(--dim);transition:color .08s linear}
.guide-text .pw.seen{color:var(--muted)}
.guide-text .pw.fix{color:var(--ink);background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.guide-bar{position:absolute;width:2px;background:var(--accent);opacity:0;pointer-events:none}
.guide-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--accent);transform:translate(-50%,0);pointer-events:none;transition:left .07s linear,top .07s linear}

/* métronome à deux ancres : l'œil saute de gauche à droite */
.ma{position:relative;height:clamp(230px,38vh,330px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:4px;display:flex;align-items:center;justify-content:space-between;padding:0 4%}
.ma::before{content:"";position:absolute;left:26%;right:26%;top:50%;height:1px;background:var(--line);opacity:.7}
.ma-slot{position:relative;width:44%;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:1}
.ma-dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--line);background:var(--bg);transition:background .12s,box-shadow .12s,border-color .12s}
.ma-slot.on .ma-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 16%,transparent)}
.ma-word{font-family:var(--serif);font-size:calc(clamp(1.15rem,2.5vw,1.8rem) * var(--tscale));line-height:1.2;white-space:nowrap;opacity:0;transition:opacity .1s linear;text-align:center}
.ma-slot.on .ma-word{opacity:1}

/* lecture guidée : le curseur balaie, le texte lu s'efface */
.pacer-wrap{position:relative;max-height:52vh;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin-top:4px}
.pacer-bar{position:absolute;width:2px;background:var(--accent);opacity:.85;pointer-events:none;transition:left .12s linear,top .12s linear,height .12s linear}
.read-text .pw.gone{opacity:0}

/* empan vertical */
.ev-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:clamp(240px,42vh,380px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:4px}
.ev-col{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--serif);font-size:calc(clamp(1.05rem,2.2vw,1.55rem) * var(--tscale));line-height:1.25}
.ev-col .ev-w{white-space:nowrap;opacity:0;transition:opacity .05s linear}
.ev-stage.show .ev-w{opacity:1}
.ev-arrow{position:absolute;top:50%;transform:translateY(-50%);color:var(--accent);font-size:15px;opacity:0;transition:opacity .05s linear}
.ev-stage.show .ev-arrow{opacity:.9}
.ev-arrow.l{left:calc(50% - 120px)}
.ev-arrow.r{right:calc(50% - 120px)}

/* saccades */
.sacc{position:relative;height:clamp(240px,40vh,340px);border:1px solid var(--line);background:var(--bg-2);overflow:hidden;margin-top:4px}
.sacc-anchor{position:absolute;width:9px;height:9px;border:1px solid var(--line-2);border-radius:50%;transform:translate(-50%,-50%)}
.sacc-letter{position:absolute;transform:translate(-50%,-50%);font-family:var(--serif);font-size:clamp(2rem,5vw,3.2rem);color:var(--accent);opacity:0;transition:opacity .05s linear}
.sacc-letter.on{opacity:1}
.exo-fam{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:14px 4px 2px}
.exo-fam:first-child{padding-top:0}

/* semaine / historique journalier */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;padding:8px 2px 4px}
.wday{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.wk{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.wbar{height:58px;width:100%;background:var(--bg-2);border:1px solid var(--line);display:flex;align-items:flex-end}
.wbar i{display:block;width:100%;background:var(--line-2)}
.wday.has .wbar i{background:var(--accent);opacity:.85}
.wday.today .wbar{border-color:var(--accent)}
.wval{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-height:14px}
.daytable td.n{white-space:nowrap}
.delta-up{color:var(--ok)}
.delta-down{color:var(--warn)}

/* progression de jeu : niveau, XP, mission */
.xp{display:flex;align-items:center;gap:8px;margin-top:10px}
.xp-bar{flex:1;height:4px;background:var(--bg-2);border:1px solid var(--line);position:relative;overflow:hidden}
.xp-bar i{position:absolute;inset:0;right:auto;background:var(--accent);transition:width .3s}
.xp-num{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.mission{border:1px solid var(--line);background:var(--bg-2);padding:14px;display:flex;flex-direction:column;gap:10px}
.mission.done{border-color:var(--accent)}
.mission-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mission-t{display:flex;flex-direction:column;gap:2px}
.mission-t b{font-size:14px}
.mission-t span{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.m-task{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
.m-task:first-of-type{border-top:0}
.m-task .tick{width:14px;height:14px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--accent);flex:none}
.m-task.ok .tick{border-color:var(--accent);background:var(--accent-soft)}
.m-task.ok span.lbl{color:var(--dim);text-decoration:line-through}
.m-task .lbl{flex:1;font-size:12.5px}
.combo{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.08em}

/* exercice périphérie */
.periph{position:relative;height:clamp(260px,42vh,360px);border:1px solid var(--line);background:var(--bg-2);overflow:hidden}
.periph-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;color:var(--muted);font-family:var(--mono);font-size:16px;line-height:18px;text-align:center}
.periph-target{position:absolute;transform:translate(-50%,-50%);font-family:var(--serif);font-size:clamp(1.2rem,2.6vw,1.7rem);color:var(--accent);opacity:0}
.periph-target.on{opacity:1}
.periph-mask{position:absolute;inset:0;background:var(--bg);opacity:0;transition:opacity .02s}
.periph-mask.on{opacity:1}

/* free read / recall */
.freeread{width:100%;max-width:720px;margin:0 auto}
.freeread-scroll{max-height:54vh;overflow:auto;padding-right:10px;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding-top:16px;padding-bottom:16px}
.freeread-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:16px}
.clock{font-family:var(--mono);font-size:22px;letter-spacing:-.02em}
textarea.recall{width:100%;min-height:150px;background:var(--surface);border:1px solid var(--line-2);
  padding:12px 14px;border-radius:2px;font-family:var(--serif);font-size:15px;line-height:1.6;resize:vertical}
textarea.recall:focus{border-color:var(--accent);outline:none}

/* result */
.result{width:100%;max-width:720px;margin:0 auto}
.result h2{font-size:clamp(24px,3.4vw,34px);margin:6px 0 18px}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:18px}
.result-grid div{background:var(--surface);padding:12px 14px}
.result-grid b{font-family:var(--mono);font-size:24px;font-weight:400;display:block;line-height:1.1}
.result-grid .hi{background:var(--surface-3)}
.result-grid .hi b{color:var(--accent)}
.result-grid small{color:var(--dim);font-size:11px}
.verdict{border:1px solid var(--line);background:var(--bg-2);padding:14px 16px;font-size:13.5px;
  color:var(--muted);margin-bottom:18px}
.verdict strong{color:var(--ink);font-weight:500}
.result-actions{display:flex;flex-wrap:wrap;gap:8px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;font-size:12.5px;z-index:90;border-radius:2px;font-family:var(--mono);letter-spacing:.02em}

/* guide */
.prose{max-width:66ch;display:flex;flex-direction:column;gap:16px}
.prose h2{font-size:20px;margin-top:14px}
.prose h3{font-size:15px;font-family:var(--sans);font-weight:600;margin-top:6px}
.prose p,.prose li{color:var(--muted);font-size:14px;line-height:1.65}
.prose ul{display:flex;flex-direction:column;gap:7px;padding-left:0}
.prose li{padding-left:16px;position:relative}
.prose li::before{content:"—";position:absolute;left:0;color:var(--dim)}
.prose code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:2px;color:var(--ink)}
.prose .note{border-left:2px solid var(--accent);padding:2px 0 2px 14px;color:var(--muted)}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;
    flex-wrap:wrap;align-items:center;gap:14px;padding:12px 16px}
  .brand-sub{display:none}
  .nav{flex-direction:row;overflow:auto;flex:1;min-width:0}
  .nav-item{white-space:nowrap;padding:8px 10px;min-height:36px}
  .rail-foot{margin:0;flex-direction:row;align-items:center;gap:10px;border:0;padding:0}
  .dial{display:none}
  main{padding:20px 16px 70px}
  .grid-main{grid-template-columns:1fr}
  .statusbar{grid-template-columns:1fr 1fr}
  .stage-host{padding:18px 14px}
  .read-text{font-size:calc(17px * var(--tscale))}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

<script>
/* =========================================================
   0. CONTENU
   ========================================================= */
const TEXTE_SECOURS = [
  {
    id:'draisienne', titre:'La machine à courir', niveau:1,
    corps:`En 1817, un Allemand nommé Karl Drais présente une machine étonnante : deux roues alignées, un cadre en bois, et aucune pédale. Pour avancer, il faut pousser le sol avec ses pieds, comme on marche. Le public appelle l'engin « draisienne », ou parfois « machine à courir ». Les Parisiens s'en amusent un été, puis l'oublient. Il faut attendre les années 1860 pour que des pédales apparaissent, fixées directement sur la roue avant. Le cycliste tourne alors les jambes en même temps que la roue : c'est épuisant, mais on va plus vite qu'à pied. Le grand-bi, avec sa roue avant démesurée, devient la star des années 1870. Puis la chaîne change tout : elle permet de placer les deux roues à la même taille et de transmettre l'effort sans secousses.`,
    q:[
      {q:"Qui présente la machine en 1817 ?", o:["Karl Drais","John Kemp Starley","Louis Braille"], r:0, e:"Le texte l'attribue à Karl Drais, un Allemand."},
      {q:"Comment avançait-on sur une draisienne ?", o:["En pédalant sur la roue avant","En poussant le sol avec les pieds","En tirant sur des cordes"], r:1, e:"Aucune pédale : la poussée vient du sol."},
      {q:"Combien de temps les Parisiens s'en amusent-ils ?", o:["Un été","Dix ans","Un hiver"], r:0, e:"Le texte dit : « un été, puis l'oublient »."},
      {q:"Quel élément technique rend les deux roues égales possibles ?", o:["La chaîne","Le cadre en bois","Le grand-bi"], r:0, e:"La chaîne transmet l'effort sans imposer une grande roue motrice."}
    ]
  },
  {
    id:'braille', titre:'Six points', niveau:1,
    corps:`Louis Braille perd la vue à trois ans, après un accident dans l'atelier de son père. À dix ans, il entre à l'Institut des jeunes aveugles de Paris, où les livres sont énormes : des lettres en relief, lourdes, lentes à parcourir des doigts. Un officier lui fait découvrir un code militaire fait de points en relief, pensé pour lire la nuit sans lumière. Louis en retient l'idée et la simplifie. À quinze ans, il met au point son système : six points disposés en rectangle, comme les cases d'un domino. Avec six points, on peut former soixante-trois signes, assez pour l'alphabet, les chiffres, la ponctuation et même la musique. Le code est publié en 1829. Les élèves l'adoptent tout de suite ; l'administration, elle, mettra des décennies à l'accepter.`,
    q:[
      {q:"À quel âge Louis Braille met-il au point son système ?", o:["Trois ans","Dix ans","Quinze ans"], r:2, e:"Il a quinze ans lorsqu'il fixe les six points."},
      {q:"Combien de points composent une cellule braille ?", o:["Six","Neuf","Douze"], r:0, e:"Six points, disposés en rectangle."},
      {q:"Quel code inspire Louis Braille ?", o:["Un code militaire lu la nuit","Un alphabet grec","Un système de musique"], r:0, e:"Un code militaire en points, lisible sans lumière."},
      {q:"Qui adopte le code immédiatement ?", o:["L'administration","Les élèves","L'armée"], r:1, e:"Les élèves l'adoptent ; l'administration traîne des décennies."}
    ]
  },
  {
    id:'pieuvre', titre:'Trois cœurs', niveau:2,
    corps:`Une pieuvre n'a pas un cœur, mais trois. Deux envoient le sang vers les branchies, où il s'oxygène ; le troisième alimente le reste du corps. Son sang est bleu, non par poésie mais par chimie : là où le nôtre utilise du fer, le sien utilise du cuivre, ce qui fonctionne mieux dans une eau froide et pauvre en oxygène. Autre étrangeté : les neurones de la pieuvre ne sont pas tous dans sa tête. Deux tiers environ logent dans ses bras, qui peuvent donc décider localement d'explorer une fissure sans attendre l'ordre du cerveau central. Pour changer de couleur, elle ne teint pas sa peau : elle étire ou contracte de minuscules sacs de pigment, les chromatophores, comme on ouvre et ferme des volets. Le résultat est presque immédiat.`,
    q:[
      {q:"À quoi servent les deux cœurs branchiaux ?", o:["Alimenter les bras","Envoyer le sang vers les branchies","Chauffer le corps"], r:1, e:"Ils poussent le sang vers les branchies pour l'oxygéner."},
      {q:"Pourquoi le sang d'une pieuvre est-il bleu ?", o:["À cause du cuivre","À cause du froid","À cause des pigments de la peau"], r:0, e:"Le cuivre remplace le fer : le sang devient bleu."},
      {q:"Où se trouvent la majorité des neurones ?", o:["Dans la tête","Dans les bras","Dans les branchies"], r:1, e:"Environ deux tiers sont dans les bras."},
      {q:"Comment la pieuvre change-t-elle de couleur ?", o:["En teignant sa peau","En étirant des sacs de pigment","En produisant de la lumière"], r:1, e:"Les chromatophores s'ouvrent et se ferment comme des volets."}
    ]
  },
  {
    id:'metre', titre:'La longueur d\'un méridien', niveau:2,
    corps:`Le mètre n'est pas né d'un caprice. À la fin du XVIIIe siècle, chaque province française avait ses unités : ici une aune, là une toise, ailleurs un pied qui ne mesurait pas le pied du voisin. Un marchand ne pouvait pas comparer deux prix sans table de conversion. En 1791, l'Académie des sciences propose une unité tirée de la nature elle-même : la dix-millionième partie de la distance entre le pôle Nord et l'équateur. Deux astronomes partent alors mesurer un arc de méridien entre Dunkerque et Barcelone — un travail de sept ans, sous la Révolution, avec des instruments fragiles et des routes incertaines. Le mètre-étalon en platine est déposé en 1799. En 1983, on change de référence : le mètre devient la distance parcourue par la lumière en un temps donné. On ne mesure plus un objet, on mesure une vitesse.`,
    q:[
      {q:"Quel problème le mètre devait-il résoudre ?", o:["Le manque d'instruments","La multiplicité des unités locales","Le coût du transport"], r:1, e:"Chaque province avait ses propres unités."},
      {q:"Sur quoi repose la première définition ?", o:["Le trajet de la lumière","Un arc du méridien terrestre","Le poids d'un litre d'eau"], r:1, e:"La dix-millionième partie du quart du méridien."},
      {q:"Quand le mètre-étalon est-il déposé ?", o:["1791","1799","1983"], r:1, e:"Le platine est déposé en 1799."},
      {q:"Quelle est la référence depuis 1983 ?", o:["La lumière","Le platine","Le méridien"], r:0, e:"Le mètre se définit par la distance parcourue par la lumière."}
    ]
  },
  {
    id:'sommeil', titre:'La nuit trie', niveau:3,
    corps:`Apprendre ne s'arrête pas quand on ferme le livre. Pendant le sommeil, le cerveau rejoue une partie de ce qu'il vient de vivre, à une vitesse accélérée, dans les mêmes régions qui se sont activées le jour. Ce phénomène, observé d'abord chez l'animal, a été retrouvé chez l'humain : les zones mobilisées par une tâche se rallument la nuit. Les nuits de sommeil profond semblent favoriser la consolidation des faits ; le sommeil paradoxal, celui des rêves, interviendrait plutôt dans les apprentissages moteurs et les liens entre idées. Les expériences le montrent de façon brutale : un groupe qui apprend une liste puis dort normalement la restitue mieux, le lendemain, qu'un groupe équivalent privé de sommeil. Ce n'est pas seulement une question de fatigue : la privation empêche le tri. Le cerveau ne garde pas tout, il sélectionne, et cette sélection demande du temps — du temps sans vigilance.`,
    q:[
      {q:"Que fait le cerveau pendant le sommeil ?", o:["Il efface les souvenirs","Il rejoue une partie de ce qu'il a vécu","Il arrête toute activité"], r:1, e:"Il rejoue, à vitesse accélérée, l'activité du jour."},
      {q:"Quel sommeil favoriserait les faits ?", o:["Le sommeil profond","Le sommeil paradoxal","La sieste courte"], r:0, e:"Le profond pour les faits, le paradoxal pour le moteur et les liens."},
      {q:"Que fait le cerveau quand il « rejoue » la journée ?", o:["Il trie et sélectionne","Il efface tout","Il recommence l'apprentissage en entier"], r:0, e:"Il ne garde pas tout : il sélectionne."},
      {q:"Pourquoi la privation de sommeil nuit-elle ?", o:["Elle fatigue les muscles","Elle empêche le tri des informations","Elle réduit l'attention du soir"], r:1, e:"Ce n'est pas qu'une question de fatigue."}
    ]
  },
  {
    id:'gutenberg', titre:"L'encre et le métal", niveau:3,
    corps:`Avant Gutenberg, un livre est un objet de plusieurs mois de travail : un copiste recopie à la main, page après page, et une bible peut occuper un atelier entier pendant un an. L'idée de Gutenberg, à Mayence vers 1450, n'est pas l'imprimerie — les Chinois imprègnent du papier depuis des siècles — mais la combinaison de trois savoir-faire : des caractères mobiles en métal, une presse à vis empruntée aux vignerons, et une encre grasse qui adhère au métal. Chaque lettre est fondue séparément, puis rangée dans un casier : on compose, on imprime, on démonte, on recompose. Le premier grand ouvrage, la Bible dite à quarante-deux lignes, demande encore des années. Mais le coût d'un exemplaire supplémentaire s'effondre : une fois les pages composées, imprimer cent copies ne coûte presque rien de plus que d'en imprimer une. C'est cette arithmétique-là qui change la suite.`,
    q:[
      {q:"Quelle innovation est attribuée à Gutenberg ?", o:["L'invention du papier","La combinaison de caractères mobiles, presse et encre","La traduction de la Bible"], r:1, e:"Trois savoir-faire combinés, pas une invention isolée."},
      {q:"D'où vient la presse à vis ?", o:["Des vignerons","Des Chinois","Des copistes"], r:0, e:"Elle est empruntée aux vignerons."},
      {q:"Quel effet économique est décisif ?", o:["Chaque copie coûte plus cher","Le coût par copie supplémentaire s'effondre","Le papier devient rare"], r:1, e:"C'est cette arithmétique qui change la suite."},
      {q:"Quel est le premier grand ouvrage cité ?", o:["La Bible à 42 lignes","Un atlas","Un dictionnaire"], r:0, e:"La Bible dite à quarante-deux lignes."}
    ]
  },
  {
    id:'feuille', titre:"L'atelier des feuilles", niveau:4,
    corps:`Une feuille est un atelier chimique alimenté par la lumière. Dans ses cellules, des organites appelés chloroplastes contiennent de la chlorophylle, le pigment qui absorbe surtout le bleu et le rouge — et réfléchit le vert, ce qui explique la couleur que nous voyons. La plante capte le dioxyde de carbone par de petits pores, les stomates, et puise l'eau par ses racines. Avec l'énergie lumineuse, elle assemble ces briques en sucres, et rejette de l'oxygène. Ce dernier détail mérite qu'on s'y arrête : l'oxygène que nous respirons est un déchet de cette réaction. La plante ne le produit pas pour nous. Autre point souvent oublié : la photosynthèse ne fonctionne pas en continu. La nuit, la feuille respire comme nous, consomme de l'oxygène et libère du dioxyde de carbone ; mais le jour, le bilan penche très largement dans l'autre sens. À l'échelle de la planète, ce déséquilibre quotidien a façonné l'atmosphère.`,
    q:[
      {q:"Pourquoi une feuille paraît-elle verte ?", o:["Elle absorbe le vert","Elle réfléchit le vert","Elle produit du vert"], r:1, e:"La chlorophylle réfléchit le vert qu'elle absorbe peu."},
      {q:"Par où entre le dioxyde de carbone ?", o:["Les racines","Les stomates","La chlorophylle"], r:1, e:"Les stomates sont de petits pores."},
      {q:"Que représente l'oxygène produit ?", o:["Un aliment","Un déchet de la réaction","Un pigment"], r:1, e:"C'est un déchet — la plante ne le produit pas pour nous."},
      {q:"Que fait la feuille la nuit ?", o:["Elle arrête toute réaction","Elle respire et consomme de l'oxygène","Elle stocke la lumière"], r:1, e:"La nuit, elle respire comme nous."}
    ]
  },
  {
    id:'ciel', titre:'Pourquoi le ciel', niveau:4,
    corps:`Le ciel est bleu parce que l'air n'est pas vide. Les molécules de l'atmosphère diffusent la lumière du soleil dans toutes les directions, mais pas également selon la longueur d'onde : les courtes, celles du bleu et du violet, sont déviées beaucoup plus fortement que les grandes, celles du rouge. C'est la diffusion de Rayleigh. Notre œil étant plus sensible au bleu qu'au violet, et le soleil émettant davantage de bleu, le résultat penche vers le bleu. Ce phénomène explique aussi le soir : quand le soleil est bas, sa lumière traverse une épaisseur d'atmosphère bien plus grande. Les courtes longueurs d'onde ont été diffusées ailleurs en chemin ; il ne reste presque que les grandes. Le ciel devient rouge — et la lumière qui nous arrive est littéralement celle qui a le moins été déviée. Vu de la Lune, où il n'y a pas d'atmosphère, le ciel est noir même en plein jour.`,
    q:[
      {q:"Quel nom porte ce type de diffusion ?", o:["Diffusion de Rayleigh","Effet Doppler","Diffusion totale"], r:0, e:"La diffusion de Rayleigh dépend de la longueur d'onde."},
      {q:"Quelles longueurs d'onde sont le plus déviées ?", o:["Les courtes","Les longues","Toutes autant"], r:0, e:"Bleu et violet, les courtes, sont les plus déviées."},
      {q:"Pourquoi le ciel rougit-il le soir ?", o:["Le soleil change de couleur","La lumière traverse plus d'atmosphère","Les nuages filtrent le bleu"], r:1, e:"Le trajet est plus long, les courtes longueurs d'onde ont été diffusées."},
      {q:"Pourquoi le ciel lunaire est-il noir ?", o:["Il n'y a pas d'atmosphère","Le soleil est plus faible","La Lune tourne vite"], r:0, e:"Sans atmosphère, pas de diffusion."}
    ]
  },
  {
    id:'multitache', titre:'Le prix du changement', niveau:5,
    corps:`Le multitâche est une expression trompeuse : le cerveau ne fait pas deux choses à la fois quand les deux demandent de l'attention, il alterne. Chaque alternance a un prix, appelé coût de commutation. Ce prix est mesurable : dans une expérience classique, les participants trient des cartes selon une règle qui change par intermittence. Quand la règle est stable, les réponses sont rapides ; quand elle alterne, elles ralentissent nettement, même si la tâche reste simple. Ce qui se perd, ce n'est pas seulement du temps, c'est de la profondeur : on garde en mémoire une représentation incomplète de ce qu'on faisait avant d'être interrompu. Une notification ne coûte pas les quelques secondes de sa lecture, mais la reconstruction mentale qui suit. Certains travaux suggèrent qu'il faut plusieurs minutes pour retrouver le niveau d'engagement antérieur ; d'autres contestent l'ampleur du chiffre. Le mécanisme, lui, est solide : l'attention est un filtre étroit, pas un projecteur large.`,
    q:[
      {q:"Que signifie « coût de commutation » ?", o:["Le prix d'un ordinateur","Le ralentissement dû à l'alternance entre tâches","La fatigue visuelle"], r:1, e:"Chaque alternance a un prix mesurable."},
      {q:"Qu'est-ce qui se perd en plus du temps ?", o:["De la mémoire vive","Une représentation incomplète de la tâche précédente","La motivation"], r:1, e:"La profondeur, pas seulement les secondes."},
      {q:"Quel point est présenté comme contesté ?", o:["L'existence du mécanisme","L'ampleur du temps de reprise","La définition de l'attention"], r:1, e:"L'ampleur du chiffre est discutée, pas le mécanisme."},
      {q:"Comment le texte définit-il l'attention ?", o:["Un projecteur large","Un filtre étroit","Un réservoir limité"], r:1, e:"« Un filtre étroit, pas un projecteur large »."}
    ]
  },
  {
    id:'horloge', titre:"L'horloge interne", niveau:5,
    corps:`Nous ne mesurons pas le temps seulement avec des horloges : nous le portons. Dans le cerveau, une petite structure de l'hypothalamus, le noyau suprachiasmatique, tient le rôle de chef d'orchestre. Ses cellules produisent des protéines dont l'accumulation puis la dégradation suivent un cycle de près de vingt-quatre heures. Ce rythme, dit circadien, commande la température du corps, la pression artérielle, la sécrétion de mélatonine et la vigilance. Il n'est pas exactement calé sur la journée solaire : sans indication extérieure, un humain isolé dérive, ses journées s'allongent de quelques minutes. La lumière du matin, captée par des cellules de la rétine qui ne servent pas à voir, remet le système à l'heure chaque jour. D'où l'effet des écrans tardifs : une lumière riche en bleu, perçue le soir, retarde le signal de la nuit et décale l'ensemble. Le décalage n'est pas une impression, il se lit dans la courbe de température et dans l'heure d'endormissement.`,
    q:[
      {q:"Quelle structure joue le rôle d'horloge ?", o:["L'hypophyse","Le noyau suprachiasmatique","La rétine"], r:1, e:"Une petite structure de l'hypothalamus."},
      {q:"Pourquoi le rythme dérive-t-il sans lumière ?", o:["Il n'est pas exactement de 24 heures","Il s'arrête","Il dépend de la température"], r:0, e:"Ses journées s'allongent de quelques minutes."},
      {q:"Quelles cellules règlent l'horloge le matin ?", o:["Des cellules de la rétine qui ne servent pas à voir","Les cônes uniquement","Les cellules de la peau"], r:0, e:"La lumière du matin, captée par des cellules non visuelles."},
      {q:"Pourquoi les écrans tardifs décalent-ils ?", o:["Ils éclairent trop","Leur lumière bleue retarde le signal de la nuit","Ils chauffent le visage"], r:1, e:"La lumière bleue perçue le soir retarde le signal."}
    ]
  }

function chunkForLevel(){
  const i=levelIdx();
  return i>=9?8 : i>=8?6 : i>=7?5 : i>=6?4 : i>=5?3 : i>=3?2 : 1;
}

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const words = t => t.trim().split(/\s+/).filter(Boolean);
const wc = t => words(t).length;
// tokens de lecture : une ponctuation isolée ( « , : — » ) ne compte pas comme un mot
const readTokens = t => {
  const out=[];
  for(const w of words(t)){
    if(/[0-9A-Za-zÀ-ÿ]/.test(w)) out.push(w);
    else if(out.length) out[out.length-1]+=' '+w;
    else out.push(w);
  }
  return out;
};
const rnd = (a,b)=>a+Math.random()*(b-a);
const mmss = ms => { const s=Math.round(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const dayKey = d => { const x=new Date(d||Date.now()); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const minOf = (l,field)=>{ const v=l.map(x=>x[field]).filter(x=>typeof x==='number'&&!isNaN(x)); return v.length?Math.min(...v):null; };
const maxOf = (l,field)=>{ const v=l.map(x=>x[field]).filter(x=>typeof x==='number'&&!isNaN(x)); return v.length?Math.max(...v):null; };
// « récent » : les critères ne doivent pas être validés par un vieux record
const bestRecent = (l,field,n=2)=>{ const v=l.slice(-n).map(x=>x[field]).filter(x=>typeof x==='number'&&!isNaN(x)); return v.length?Math.min(...v):null; };
const maxRecent  = (l,field,n=2)=>{ const v=l.slice(-n).map(x=>x[field]).filter(x=>typeof x==='number'&&!isNaN(x)); return v.length?Math.max(...v):null; };
const countRuns = (l,{comp,wpm},tail=3)=>l.slice(-tail).filter(x=>(x.comp!=null&&x.comp>=comp)&&(x.wpm!=null&&x.wpm>=wpm)).length;

let runToken=0, cleanups=[], paused=false;
let lastRun=null;   // dernier exercice libre lancé : permet « Recommencer » avec les mêmes réglages
const stageEl=$('#stage'), host=$('#stageHost');

function begin(title,meta){
  if(!stageEl.hidden) return null; // une séance est déjà en cours : on ignore le doublon
  runToken++; cleanups=[]; paused=false;
  stageEl.hidden=false; document.body.style.overflow='hidden';
  $('#stageTitle').textContent=title||''; $('#stageMeta').textContent=meta||'';
  const rs=$('#stageRestart'); if(rs) rs.hidden=!lastRun;
  host.className='stage-host'; host.innerHTML='';
  return runToken;
}
function endStage(){
  runToken++; cleanups.forEach(f=>{ try{f();}catch(e){} }); cleanups=[];
  stageEl.hidden=true; document.body.style.overflow='';
  renderAll();
}
const alive = tok => tok===runToken;
function sleep(ms,tok){ return new Promise(res=>{ const id=setTimeout(()=>res(alive(tok)),ms); cleanups.push(()=>{clearTimeout(id);res(false);}); }); }
function wait(ms,tok){
  return new Promise(res=>{
    let acc=0,last=performance.now(),done=false;
    const finish=v=>{ if(done) return; done=true; clearInterval(id); res(v); };
    const id=setInterval(()=>{
      if(!alive(tok)) return finish(false);
      const t=performance.now();
      acc += paused?0:(t-last); last=t;
      if(acc>=ms) finish(true);
    },12);
    cleanups.push(()=>finish(false));
  });
}
function setHost(cls){ host.className='stage-host'+(cls?' '+cls:''); }
function toast(msg,ms=1800){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,ms); }

function pickText(niveau,opts){
  opts=opts||{};
  const n=clamp(niveau||1,1,5);
  let pool=TEXTS.filter(t=>(t.niveau||1)===n);
  if(opts.maxWords) pool=pool.filter(t=>wc(t.corps)<=opts.maxWords);
  if(opts.long){ const longs=pool.filter(t=>wc(t.corps)>=500); if(longs.length) pool=longs; }
  if(!pool.length) pool=TEXTS.filter(t=>Math.abs((t.niveau||1)-n)<=1);
  if(!pool.length) pool=TEXTS.slice();
  S.textUse=S.textUse||{};
  // rotation : jamais les six derniers textes vus, puis le moins lu, puis au hasard
  const recent=(S.recentTexts||[]).slice(-6);
  let cand=pool.filter(t=>!recent.includes(t.id));
  if(!cand.length) cand=pool.slice();
  const min=Math.min(...cand.map(t=>(S.textUse[t.id]||0)));
  const pickPool=cand.filter(t=>(S.textUse[t.id]||0)===min);
  const t=pickPool[Math.floor(Math.random()*pickPool.length)];
  S.textUse[t.id]=(S.textUse[t.id]||0)+1;
  S.recentTexts=(recent.concat([t.id])).slice(-8);
  S.lastText=t.id; save(); return t;
}
// nombre de questions posées après une lecture chronométrée : la vitesse prime, on échantillonne
const quizSize = t => clamp(3+(t.niveau||1),4,7);
function sampleQuiz(text,n){
  const all=(text&&text.q)||[];
  n=Math.min(n||4,all.length);
  if(all.length<=n) return all.slice();
  const idx=shuffle(all.map((_,i)=>i)).slice(0,n).sort((a,b)=>a-b);
  return idx.map(i=>all[i]);
}

function orpSplit(word){
  const n=word.length; let i = n<=1?0 : n<=5?1 : n<=9?2 : 3;
  return [word.slice(0,i),word.charAt(i),word.slice(i+1)];
}
/* un groupe de mots doit tenir sur une seule ligne : s'il est trop large, on réduit le corps */
function fitText(el){
  if(!el) return;
  el.style.fontSize='';
  const parent=el.parentElement; if(!parent) return;
  const avail=(parent.clientWidth||640)-12;
  let size=parseFloat(getComputedStyle(el).fontSize)||28, guard=0;
  while(el.scrollWidth>avail && size>14 && guard++<48){ size-=1.5; el.style.fontSize=size.toFixed(1)+'px'; }
}

function renderRsvpChunk(el,chunk){
  if(chunk.includes(' ')||!S.orp){
    el.innerHTML=`<span class="l">${esc(chunk)}</span>`;
    fitText(el);
    el.style.transform='translateX(0)';
    return;
  }
  const [l,o,r]=orpSplit(chunk);
  el.innerHTML=`<span class="l">${esc(l)}</span><span class="o">${esc(o)}</span><span class="r">${esc(r)}</span>`;
  fitText(el);
  const L=el.querySelector('.l'), O=el.querySelector('.o');
  const lw=L.getBoundingClientRect().width, ow=O.getBoundingClientRect().width, ww=el.getBoundingClientRect().width;
  el.style.transform='translateX('+((ww/2)-(lw+ow/2))+'px)';
}

let audioCtx=null;
function tickSound(strong){
  if(!S.click) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    audioCtx=audioCtx||new AC();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='square'; o.frequency.value=strong?1320:990;
    const t=audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.06,t+0.003);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+0.06);
  }catch(e){ /* audio indisponible : le battement visuel suffit */ }
}

async function blockMetronome(tok,text,wpm,wpBeat){
  setHost();
  const ws=readTokens(text.corps);
  // taille du groupe : le même réglage que le Flash (mots par affichage), qui monte avec le palier de vitesse
  const per=wpBeat||clamp(Math.max(S.chunk||1, chunkForLevel()),1,8);
  const groups=[];
  let cur=[];
  for(const w of ws){
    cur.push(w);
    if(cur.length>=per){ groups.push(cur.join(' ')); cur=[]; }
  }
  if(cur.length) groups.push(cur.join(' '));
  const bpm=clamp(Math.round(wpm/per),40,300);
  const beatMs=60000/bpm;
  host.innerHTML=`<div class="block" style="max-width:1000px">
    <div class="block-head" style="text-align:left">
      <span class="eyebrow">Métronome · ${esc(text.titre)}</span>
      <h2 style="font-size:20px">${wpm} mots/min · ${bpm} battements/min</h2>
      <p style="margin:0">Un battement = ${per>1?per+' mots':'un mot'}, et il change de côté à chaque fois : suis le point qui s'allume, de gauche à droite, sans revenir.</p>
    </div>
    <div class="ma" id="maStage">
      <div class="ma-slot" id="maL"><b class="ma-dot"></b><span class="ma-word" id="maWordL"></span></div>
      <div class="ma-slot" id="maR"><b class="ma-dot"></b><span class="ma-word" id="maWordR"></span></div>
    </div>
    <div class="read-foot"><span id="paceState">lecture</span><span class="mono" id="metroCount">0 / ${groups.length}</span><span>${wpm} mpm${S.click?' · son':' · muet'}</span></div>
  </div>`;
  const L=$('#maL'), R=$('#maR'), wl=$('#maWordL'), wr=$('#maWordR'), countEl=$('#metroCount'), st=$('#paceState');
  return new Promise(res=>{
    let i=0, done=false;
    const t0=performance.now();
    const finish=v=>{ if(done) return; done=true; clearInterval(id); res(v); };
    const beat=()=>{
      const left=(i%2===0);
      const slot=left?L:R, wordEl=left?wl:wr, other=left?R:L;
      other.classList.remove('on');
      wordEl.textContent=groups[i]||'';
      fitText(wordEl);
      slot.classList.add('on');
      countEl.textContent=(i+1)+' / '+groups.length;
      tickSound(i%4===0);
      if(st) st.textContent=paused?'pause':'lecture';
    };
    beat();
    const id=setInterval(()=>{
      if(!alive(tok)) return finish(null);
      if(paused) return;
      i++;
      if(i>=groups.length) return finish({seconds:(performance.now()-t0)/1000,words:ws.length,bpm,wpBeat:per,anchors:true});
      beat();
    },beatMs);
    cleanups.push(()=>finish(null));
  });
}

async function blockGuide(tok,text,wpm,group=3){
  setHost();
  const ws=readTokens(text.corps);
  const nGroups=Math.ceil(ws.length/group);
  host.innerHTML=`<div class="block" style="max-width:900px">
    <div class="block-head" style="text-align:left">
      <span class="eyebrow">Indicateur visuel · ${esc(text.titre)}</span>
      <h2 style="font-size:20px">${wpm} mots/min · un point de fixation tous les ${group} mots</h2>
      <p style="margin:0">Le point sous le groupe indique où poser le regard : fixe-le, prends le groupe entier d'un seul coup, puis saute au point suivant.</p>
    </div>
    <div class="guide-wrap" id="guideWrap">
      <div class="read-text guide-text" id="guideText">${(()=>{const gs=[];for(let i=0;i<ws.length;i+=group) gs.push(ws.slice(i,i+group));return gs.map(g=>`<span class="grp">${g.map(w=>`<span class="pw">${esc(w)}</span>`).join(' ')}</span>`).join(' ');})()}</div>
      <b class="guide-dot" id="guideDot"></b>
    </div>
    <div class="read-foot"><span id="paceState">lecture</span><span class="mono" id="guideCount"></span></div>
  </div>`;
  const wrap=$('#guideWrap'), spans=$$('#guideText .pw'), dot=$('#guideDot');
  const msPerGroup=(group/wpm)*60000;
  const t0=performance.now();
  let g=0, done=false;
  return new Promise(res=>{
    const finish=v=>{ if(done) return; done=true; clearInterval(id); res(v); };
    const paint=()=>{
      const from=g*group, to=Math.min(ws.length-1, from+group-1);
      const first=spans[from], last=spans[to];
      if(first&&last){
        // point de fixation : centre du groupe, posé dans l'interligne sous les lettres (jamais sur les lettres)
        const x0=first.offsetLeft, x1=last.offsetLeft+last.offsetWidth;
        const glyphH=first.getBoundingClientRect().height||parseFloat(getComputedStyle(first).fontSize)||19;
        const glyphBottom=first.offsetTop+(first.offsetHeight+glyphH)/2;   // bas des lettres, en coordonnées de contenu
        dot.style.left=((x0+x1)/2)+'px'; dot.style.top=(glyphBottom+3.5)+'px';
        wrap.scrollTop=Math.max(0, first.offsetTop-wrap.clientHeight*0.42);
      }
      for(let k=0;k<spans.length;k++){
        const s=spans[k]; if(!s) continue;
        s.classList.toggle('seen', k<=to);
        s.classList.toggle('fix', k>=from&&k<=to);
      }
      const c=$('#guideCount'); if(c) c.textContent=(g+1)+' / '+nGroups;
      const st=$('#paceState'); if(st) st.textContent=paused?'pause':'lecture';
    };
    paint();
    const id=setInterval(()=>{
      if(!alive(tok)) return finish(null);
      if(paused) return;
      g++;
      if(g>=nGroups) return finish({seconds:(performance.now()-t0)/1000,words:ws.length,group});
      paint();
    },msPerGroup);
    cleanups.push(()=>finish(null));
  });
}

const SAC_LETTERS='BDGKMNPRSTVXZ';
async function blockSaccades(tok,rounds=3){
  const ANCH=[{x:16,y:50},{x:50,y:20},{x:84,y:50},{x:50,y:80}];
  const per=6, dur=380, gap=140;
  let correct=0;
  for(let r=0;r<rounds;r++){
    const seq=[]; let prev=-1, prevCh='';
    for(let i=0;i<per;i++){
      let a; do{ a=Math.floor(Math.random()*ANCH.length); } while(a===prev);
      prev=a;
      let ch; do{ ch=SAC_LETTERS[Math.floor(Math.random()*SAC_LETTERS.length)]; } while(ch===prevCh);
      prevCh=ch;
      seq.push({a, ch});
    }
    setHost();
    host.innerHTML=`<div class="block" style="max-width:680px">
      <div class="block-head" style="text-align:left">
        <span class="eyebrow">Saccades · manche ${r+1} / ${rounds}</span>
        <h2 style="font-size:19px">Garde le regard sur les repères</h2>
        <p style="margin:0">${per} lettres, ${dur} ms chacune, sur quatre ancres fixes. Tu devras restituer la séquence : ne balaie pas la zone, saute d'ancre en ancre.</p>
      </div>
      <div class="sacc" id="sacc">
        ${ANCH.map(a=>`<i class="sacc-anchor" style="left:${a.x}%;top:${a.y}%"></i>`).join('')}
        <b class="sacc-letter" id="saccLetter"></b>
      </div>
      <div class="read-foot"><span>manche ${r+1} / ${rounds}</span><span class="mono">${correct} juste${correct>1?'s':''}</span></div>
    </div>`;
    const letter=$('#saccLetter');
    if(!await sleep(700,tok)) return null;
    for(const s of seq){
      if(!alive(tok)) return null;
      const A=ANCH[s.a];
      letter.style.left=A.x+'%'; letter.style.top=A.y+'%';
      letter.textContent=s.ch; letter.classList.add('on');
      if(!await sleep(dur,tok)) return null;
      letter.classList.remove('on');
      if(!await sleep(gap,tok)) return null;
    }
    const truth=seq.map(s=>s.ch).join(' ');
    const v1=[...seq.map(s=>s.ch)]; [v1[1],v1[4]]=[v1[4],v1[1]];
    const v2=[...seq.map(s=>s.ch)];
    v2[2]=SAC_LETTERS.replace(v2[2],'')[Math.floor(Math.random()*(SAC_LETTERS.length-1))]||v2[2];
    const opts=shuffle([truth,v1.join(' '),v2.join(' ')]);
    setHost();
    host.innerHTML=`<div class="block" style="max-width:680px">
      <div class="block-head" style="text-align:left">
        <span class="eyebrow">Saccades · manche ${r+1} / ${rounds}</span>
        <h2 style="font-size:19px">Quelle séquence as-tu vue ?</h2>
      </div>
      <div class="empan-opts">
        ${opts.map((o,k)=>`<button class="opt" data-p="${esc(o)}"><span class="ok-k mono">${k+1}</span><span class="mono" style="font-size:16px;letter-spacing:.18em">${esc(o)}</span></button>`).join('')}
      </div>
      <div id="saccFb"></div>
    </div>`;
    const picked=await new Promise(resolve=>{
      const onClick=e=>{ const b=e.target.closest('[data-p]'); if(!b) return; resolve(b.dataset.p); };
      const onKey=e=>{ const k=+e.key; if(k>=1&&k<=opts.length){ const b=host.querySelectorAll('.opt')[k-1]; if(b) b.click(); } };
      host.addEventListener('click',onClick); document.addEventListener('keydown',onKey);
      cleanups.push(()=>{ host.removeEventListener('click',onClick); document.removeEventListener('keydown',onKey); });
    });
    if(!alive(tok)) return null;
    const good=picked===truth;
    if(good) correct++;
    $$('.opt',host).forEach(b=>{ b.classList.add(b.dataset.p===truth?'good':(b.dataset.p===picked?'bad':'dim')); });
    const fb=$('#saccFb');
    if(fb) fb.innerHTML=`<div class="quiz-fb"><b>${good?'Juste.':'Raté.'}</b> Séquence : <span class="mono">${esc(truth)}</span></div>`;
    if(!await sleep(1100,tok)) return null;
  }
  return {correct,total:rounds,acc:correct/rounds};
}

/* identification en vision périphérique : fixation centrale imposée, cible brève, masque rétroactif */
async function blockPeriph(tok,rounds=8){
  const NEAR=[{x:37,y:35},{x:63,y:35},{x:63,y:65},{x:37,y:65}];
  const FAR=[{x:12,y:50},{x:88,y:50},{x:50,y:12},{x:50,y:88}];
  const L='BDGKMNPRSTVXZ';
  S.periphDur=clamp(S.periphDur||220,80,320);
  const dur=S.periphDur;
  setHost();
  host.innerHTML=`<div class="block" style="max-width:780px">
    <div class="block-head" style="text-align:left">
      <span class="eyebrow">Vision périphérique · ${rounds} essais</span>
      <h2 style="font-size:19px">Regarde le point central, ne le quitte pas</h2>
      <p style="margin:0">Une lettre apparaît sur le côté pendant <b>${dur} ms</b>, puis l'écran est masqué. Si tu bouges les yeux pour la chercher, l'exercice ne mesure plus rien : identifie-la du coin de l'œil.</p>
    </div>
    <div class="periph" id="periph">
      <div class="periph-center">+</div>
      <b class="periph-target" id="periphTarget"></b>
      <div class="periph-mask" id="periphMask"></div>
    </div>
    <div id="periphOpts" class="quiz-opts" style="margin-top:14px"></div>
    <div class="read-foot"><span id="periphState">fixation</span><span class="mono" id="periphScore">0 / ${rounds}</span></div>
  </div>`;
  const tgt=$('#periphTarget'), mask=$('#periphMask'), opts=$('#periphOpts'), scoreEl=$('#periphScore'), stateEl=$('#periphState');
  let correct=0;
  const bucket={near:[0,0],far:[0,0]};
  for(let i=0;i<rounds;i++){
    if(!alive(tok)) return null;
    const far=(i%2===1);
    const ring=far?FAR:NEAR;
    const A=ring[Math.floor(Math.random()*ring.length)];
    const ch=L[Math.floor(Math.random()*L.length)];
    const options=shuffle([ch].concat(shuffle(L.split('').filter(c=>c!==ch)).slice(0,3)));
    opts.innerHTML='';
    mask.classList.remove('on');
    stateEl.textContent='fixation';
    tgt.style.left=A.x+'%'; tgt.style.top=A.y+'%'; tgt.textContent=ch;
    if(!await sleep(380,tok)) return null;
    tgt.classList.add('on');
    if(!await sleep(dur,tok)) return null;
    tgt.classList.remove('on'); mask.classList.add('on');
    stateEl.textContent='masqué';
    if(!await sleep(200,tok)) return null;
    opts.innerHTML=options.map((c,k)=>`<button class="opt" data-p="${c}"><span class="ok-k mono">${k+1}</span><span class="mono" style="font-size:15px;letter-spacing:.16em">${c}</span></button>`).join('');
    stateEl.textContent='quelle lettre ?';
    const picked=await new Promise(resolve=>{
      const onClick=e=>{ const b=e.target.closest('[data-p]'); if(!b) return; resolve(b.dataset.p); };
      const onKey=e=>{ const k=+e.key; if(k>=1&&k<=4){ const b=$$('.opt',opts)[k-1]; if(b) b.click(); } };
      opts.addEventListener('click',onClick); document.addEventListener('keydown',onKey);
      cleanups.push(()=>{ opts.removeEventListener('click',onClick); document.removeEventListener('keydown',onKey); });
    });
    if(!alive(tok)) return null;
    const good=picked===ch;
    if(good) correct++;
    bucket[far?'far':'near'][0]+=good?1:0;
    bucket[far?'far':'near'][1]+=1;
    $$('.opt',opts).forEach(b=>b.classList.add(b.dataset.p===ch?'good':(b.dataset.p===picked?'bad':'dim')));
    scoreEl.textContent=correct+' / '+(i+1);
    if(!await sleep(500,tok)) return null;
  }
  const acc=correct/rounds;
  S.periphDur=clamp(Math.round(acc>=.85?dur-15:acc<=.5?dur+15:dur),80,320);
  save();
  return {correct,total:rounds,acc,dur,near:bucket.near,far:bucket.far};
}

/* ---------- voix intérieure : suppression articulatoire + accès orthographique ---------- */
const ORTHO_SILENT=['tabac','doigt','poids','loup','trop','bord','nid','froid','grand','vingt','temps','corps','banc','blanc','porc','fusil','outil','gentil','galop','sirop','pot','lit','rat','chat','artichaut','escroc','accroc','noix','choix','toux','paix','voix','deux','mieux','yeux','chevaux','oiseaux','animaux','bras'];
// mots dont aucune lettre ne se prononce en moins : pas de consonne finale muette, pas de -e final, pas de h muet
const ORTHO_PLAIN=['papa','midi','vélo','café','radio','moto','stylo','photo','sac','mur','fil','col','sel','bol','jour','tour','dur','ami','défi','zéro','taxi','menu','pneu','lac','pic','truc','four','opéra','solo','abri','bikini'];

async function blockOrtho(tok,n=20){
  const silent=shuffle(ORTHO_SILENT).slice(0,Math.round(n/2));
  const plain=shuffle(ORTHO_PLAIN).slice(0,n-silent.length);
  const items=shuffle(silent.map(w=>({w,silent:true})).concat(plain.map(w=>({w,silent:false}))));
  setHost();
  host.innerHTML=`<div class="block" style="max-width:640px">
    <div class="block-head" style="text-align:center">
      <span class="eyebrow">Orthographe · ${items.length} mots</span>
      <h2 style="font-size:20px">Ce mot a-t-il une lettre muette ?</h2>
      <p style="margin:0">Réponds au clavier : <b>O</b> pour « lettre muette », <b>N</b> pour « aucune » (ou <b>1</b>/<b>2</b>, ou <b>←</b>/<b>→</b>). Tu n'as pas le temps de l'entendre dans ta tête, c'est le but.</p>
    </div>
    <div class="ortho-stage"><b class="ortho-word" id="orthoWord"></b></div>
    <div class="quiz-opts" style="display:flex;gap:10px;justify-content:center">
      <button class="opt" data-o="1" style="flex:1"><span class="ok-k mono">O</span><span>lettre muette</span></button>
      <button class="opt" data-o="0" style="flex:1"><span class="ok-k mono">N</span><span>aucune</span></button>
    </div>
    <div class="read-foot"><span id="orthoState">prêt</span><span class="mono" id="orthoScore">0 / ${items.length}</span></div>
  </div>`;
  const wordEl=$('#orthoWord'), scoreEl=$('#orthoScore'), stateEl=$('#orthoState');
  const PER=1500;
  let correct=0, timeouts=0; const lat=[], latGood=[];
  for(let i=0;i<items.length;i++){
    if(!alive(tok)) return null;
    const it=items[i];
    wordEl.textContent=it.w;
    stateEl.textContent='oui ou non';
    const t0=performance.now();
    let picked=null;
    const pickedP=new Promise(resolve=>{
      let settled=false;
      const done=v=>{ if(settled) return; settled=true; host.removeEventListener('click',onClick); document.removeEventListener('keydown',onKey); resolve(v); };
      const onClick=e=>{ const b=e.target.closest('[data-o]'); if(b) done(b.dataset.o==='1'); };
      // O / N, 1 / 2, flèches gauche / droite : le choix ne demande plus de viser à la souris
      const onKey=e=>{
        if(e.repeat) return;
        const k=(e.key||'').toLowerCase();
        if(k==='o'||k==='1'||e.key==='ArrowLeft'){ e.preventDefault(); done(true); }
        else if(k==='n'||k==='2'||e.key==='ArrowRight'){ e.preventDefault(); done(false); }
      };
      host.addEventListener('click',onClick); document.addEventListener('keydown',onKey);
      cleanups.push(()=>{ host.removeEventListener('click',onClick); document.removeEventListener('keydown',onKey); });
    });
    const timed=new Promise(resolve=>{ const id=setTimeout(()=>resolve('timeout'),PER); cleanups.push(()=>{ clearTimeout(id); resolve('timeout'); }); });
    picked=await Promise.race([pickedP,timed]);
    if(!alive(tok)) return null;
    if(picked==='timeout'){ stateEl.textContent='trop tard'; timeouts++; lat.push(PER); }
    else {
      const dt=performance.now()-t0;
      lat.push(dt);
      const good=picked===it.silent;
      if(good){ correct++; latGood.push(dt); }
      wordEl.classList.add(good?'good':'bad');
      setTimeout(()=>wordEl.classList.remove('good','bad'),260);
    }
    scoreEl.textContent=correct+' / '+(i+1);
    if(!await sleep(picked==='timeout'?260:180,tok)) return null;
  }
  const med=a=>{ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y); return Math.round(s[Math.floor(s.length/2)]); };
  return {correct,total:items.length,comp:correct/items.length,median:med(latGood),medianAll:med(lat),timeouts};
}

async function blockSuppression(tok,text,wpm,chunk=1,loop=true){
  setHost();

  for(let i=0;i<ws.length;i+=chunk) groups.push(ws.slice(i,i+chunk).join(' '));

    </div>
    <div class="read-foot"><span id="paceState">lecture</span><span>${loop?'boucle ta-ta-ta · '+bpm+'/min':'sans boucle · contrôle'}</span></div>
  </div>`;
  const wordEl=$('#suppWord'), taEl=$('#suppTa'), countEl=$('#suppCount'), prog=$('#suppProg'), st=$('#paceState');
  const ta=['ta','ta','ta','ta'];
  return new Promise(res=>{
    let i=0, k=0, done=false;
    const t0=performance.now();
    const finish=v=>{ if(done) return; done=true; clearInterval(iw); clearInterval(it); res(v); };
    const paint=()=>{ wordEl.textContent=groups[i]||''; fitText(wordEl); countEl.textContent=(i+1)+' / '+groups.length; prog.style.width=((i+1)/groups.length*100)+'%'; };
    paint();
    const it=loop?setInterval(()=>{
      if(!alive(tok)) return finish(null);
      if(paused) return;
      k++; if(taEl){ taEl.textContent=ta[k%ta.length]; taEl.classList.add('on'); setTimeout(()=>taEl.classList.remove('on'),80); }
      tickSound(k%4===0);
    },tickMs):null;
    const iw=setInterval(()=>{
      if(!alive(tok)) return finish(null);
      if(paused){ if(st) st.textContent='pause'; return; }
      if(st) st.textContent='lecture';
      i++;
      if(i>=groups.length) return finish({seconds:(performance.now()-t0)/1000,words:ws.length,wpm,chunk});
      paint();
    },wordMs);
    cleanups.push(()=>finish(null));
  });
}

function eyeBreak(force){
  return new Promise(res=>{
    if(!force&&document.getElementById('eyeBreak')) return res(false);

  });

const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXY';   // a→y : 25 lettres, de quoi remplir une grille 5×5
function gridSequence(mode,n){
  if(mode==='alpha') return Array.from({length:n},(_,i)=>LETTERS[i]);
  if(mode==='mix'){
    const out=[]; let k=1,j=0;
    while(out.length<n){ out.push(String(k++)); if(out.length<n) out.push(LETTERS[j++]); }
    return out;
  }
  return Array.from({length:n},(_,i)=>String(i+1));
}
async function blockGrid(tok,{size=4,mode='num'}={}){
  setHost();
  const n=size*size;
  const seq=gridSequence(mode,n);
  if(seq.some(v=>v==null)){ toast('Grille impossible'); return null; }
  const cells=shuffle(seq);
  const isAlpha=mode==='alpha', isMix=mode==='mix';
  // débutant : la case reste verte. avancé : vert le temps de signaler, puis neutre.
  const novice=estDebutant();
  host.innerHTML=`<div class="block" style="max-width:520px">
    <div class="block-head">
      <span class="eyebrow">Échauffement · champ visuel · ${isAlpha?'lettres':isMix?'alternée':'chiffres'} · ${size}×${size}</span>
      <h2>${isMix?'1, A, 2, B… dans cet ordre':'Clique dans l’ordre'}</h2>
      <p>Garde le regard au centre de la grille. Ce sont les yeux qui bougent, pas la tête.${novice?'':''}</p>
    </div>
    <div class="schulte ${novice?'novice':'adv'}" id="schulteGrid" style="grid-template-columns:repeat(${size},1fr)">
      ${cells.map(v=>`<button data-v="${esc(v)}">${esc(v)}</button>`).join('')}
    </div>
    <div class="schulte-meta"><span id="schTime">00:00</span><span id="schErr" class="err">0 erreur</span><span id="schNext">suivant : ${esc(seq[0])}</span></div>
    <div class="block-foot"><button class="btn ghost" id="schSkip">Passer</button><span class="hint">${novice?'les cases trouvées restent vertes':'le vert s’efface : la mémoire de la grille, c’est toi'}</span></div>
  </div>`;
  let next=0, t0=null, finished=false, errors=0;
  const timeEl=$('#schTime'), nextEl=$('#schNext'), errEl=$('#schErr');
  const tick=setInterval(()=>{ if(t0) timeEl.textContent=mmss(performance.now()-t0); },100);
  cleanups.push(()=>clearInterval(tick));
  return new Promise(res=>{
    const onClick=e=>{
      const b=e.target.closest('[data-v]'); if(!b||finished) return;
      const v=b.dataset.v;
      if(v===seq[next]){
        if(!t0) t0=performance.now();
        b.classList.add('done'); b.disabled=true;
        b.classList.add('okflash');
        setTimeout(()=>b.classList.remove('okflash'),420);
        next++;
        nextEl.textContent = next>=n ? 'terminé' : 'suivant : '+seq[next];
        if(next>=n){ finished=true; const ms=performance.now()-t0; clearInterval(tick); timeEl.textContent=mmss(ms);
          setTimeout(()=>res({seconds:ms/1000,size,mode,completed:true,errors,novice}),380); }
      } else {
        // mauvaise case : rouge, puis neutre. Comptée, jamais bloquante.
        errors++; errEl.textContent=errors+(errors>1?' erreurs':' erreur');
        b.classList.add('miss'); setTimeout(()=>b.classList.remove('miss'),340);
      }
    };
    const skip=()=>{ if(finished) return; finished=true; clearInterval(tick); res({seconds:t0?performance.now()-t0:null,size,mode,completed:false,errors,novice}); };
    $('#schulteGrid').addEventListener('click',onClick);
    $('#schSkip').addEventListener('click',skip);
    cleanups.push(()=>{ clearInterval(tick); res(null); });
  });
}
const blockSchulte=(tok,size)=>blockGrid(tok,{size,mode:'num'});
const blockLettres=(tok,size)=>blockGrid(tok,{size,mode:'alpha'});

function empanVariants(item){
  const base=item.w.join(' ');
  const out=[{phrase:base, ok:true}];
  const seen=new Set([base]);
  const len=item.w.length;
  for(const pt of (item.s||[])){
    if(pt.i>=len) continue;
    const alts=shuffle(pt.a.filter(a=>a!==item.w[pt.i]));
    for(const rep of alts){
      const w=[...item.w]; w[pt.i]=rep;
      const p=w.join(' ');
      if(!seen.has(p)){ seen.add(p); out.push({phrase:p,ok:false}); }
      if(out.length>=3) break;
    }
    if(out.length>=3) break;
  }
  return shuffle(out);
}

async function blockEmpan(tok,trials,startSpan){
  // exposition constante : seule la longueur varie, sinon on ne mesure plus l'empan
  const DUR=600;
  let span=clamp(startSpan||S.span,3,9), correct=0, bestSpan=0, hits=0, miss=0;
  const longest=Math.max(...EMPAN.map(i=>i.w.length));
  span=Math.min(span,longest);
  const items=shuffle(EMPAN).slice(0,Math.max(1,Math.min(trials,EMPAN.length)));
  for(let t=0;t<items.length;t++){
    const item=items[t];
    // longueur exacte : on ne montre jamais moins de mots que l'empan testé
    const nWords=Math.min(span,item.w.length);
    const shownSpan=nWords;
    bestSpan=Math.max(bestSpan,shownSpan);
    setHost();
    host.innerHTML=`<div class="block" style="max-width:680px">
      <div class="block-head" style="text-align:left">
        <span class="eyebrow">Empan visuel · essai ${t+1}/${items.length}</span>
